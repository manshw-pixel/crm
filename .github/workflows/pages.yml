name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # so the gate runs before a merge, not only after one. deploy is skipped on
  # pull_request runs — publishing a branch to the live site would defeat the point.
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read           # download-artifact@v4 reads the run's artifacts via the API
  pages: write
  id-token: write

concurrency:
  # per-ref now that PRs run too, so a PR's test run cannot cancel a master deploy
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CRM_TEST_CHANNEL: ""      # no Edge on the runner; use bundled Chromium
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
      - run: npm ci                       # build deps (esbuild, tailwind)
      - run: npm ci
        working-directory: tests
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      # run.mjs builds dist/ itself before the first case, so the suite can never pass
      # against a stale artifact. This runs the build separately too, so a build failure
      # is reported as a build failure rather than as 174 mystery test errors.
      - run: node build.mjs
      # NEVER pipe this — run.mjs's exit code IS the gate, and a pipe replaces it.
      # No retry: the old retry-once existed to absorb unpkg blips, and dist/ now loads
      # nothing from the network. A second attempt could only mask a flaky test.
      - run: node tests/health/run.mjs
      # hand the TESTED bytes to deploy — never rebuild between the gate and publication
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # The access-control gate. Runs in parallel with `test`, against a REAL postgres +
  # gotrue + storage rather than a mock, so a change to a policy, a trigger or the signup
  # path fails the build instead of reaching production silently.
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/rls/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # brings up real postgres + gotrue + storage; supabase-setup.sql is applied by the
      # suite's own fixtures, so the policies under test are the ones in the repo
      - run: supabase start
      - run: npm ci
        working-directory: tests/rls
      # NEVER pipe this — run.mjs's exit code IS the gate. No retry: a second attempt
      # could only mask a flaky test.
      - run: node tests/rls/run.mjs

  deploy:
    needs: [test, rls]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      # no checkout: publish exactly what the gate tested, nothing else. This also stops
      # the public site serving source, vendor/ and tests/, which `path: .` used to.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # deploy-pages intermittently fails with "Deployment failed, try again later" — retry once
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
