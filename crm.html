<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OneVio CRM</title>
<!-- tab icon: the sidebar wordmark's O (slate-900) and V (indigo-600) drawn as shapes, since a
     favicon cannot load Inter; white tile so it stays visible on dark tab bars. Inline data URI
     keeps dist/crm.html at zero network requests. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='1' y='1' width='62' height='62' rx='14' fill='%23fff' stroke='%23e2e8f0' stroke-width='2'/><circle cx='19' cy='32' r='11' fill='none' stroke='%230f172a' stroke-width='7'/><path d='M38 20.5 47 44 56 20.5' fill='none' stroke='%234f46e5' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html { font-size: 12.5px; }
  body { background: #f6f8fb; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; color: #334155; }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  /* design tokens: quiet white surfaces, hairline borders, color = meaning */
  .nm { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 1px 2px rgba(15, 23, 42, .04); }
  .nm-sm { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; box-shadow: 0 1px 2px rgba(15, 23, 42, .04); }
  .nm-inset { background: #fff; border: 1px solid #d3dce6; border-radius: 8px; transition: border-color .12s, box-shadow .12s; }
  .nm-inset:focus, .nm-inset:focus-within { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, .12); outline: none; }
  .nm-btn { background: #fff; border: 1px solid #d3dce6; border-radius: 8px; transition: background .12s; }
  .nm-btn:hover { background: #f1f5f9; }
  .nm-btn:active { background: #e2e8f0; }
  .grad { background: #4f46e5; border-radius: 8px; box-shadow: 0 1px 2px rgba(79, 70, 229, .3); }
  .grad:hover { background: #4338ca; }
  .grad:active { background: #3730a3; }
  input[type=range] { accent-color: #4f46e5; }
  /* phones only: larger base type and tap targets; desktop sizing untouched */
  @media (max-width: 640px) { html { font-size: 14px; } }
</style>
</head>
<body class="text-slate-700">
<div id="root"></div>
<script type="text/babel" data-presets="react"></script>
</body>
</html>
