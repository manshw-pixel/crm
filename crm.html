 * HEALTH SCORE LOGIC

 * score = w.usage*usage + w.sentiment*sentiment + w.tickets*ticketScore

 *
 *   usage, sentiment : stored per-account, 0..100
 *   ticketScore      : 100 - min(openTickets*10, 100)
 *   recencyScore     : 100 if last activity <=7 days ago, linear to 0 at 60d
 *   npsNorm          : (nps + 100) / 2   (NPS -100..100 -> 0..100)

 * Risk: score >=70 Green | 40..69 Yellow | <40 Red

/* textual, like isoPlus — setMonth() would overflow month-end (Jan 31 +1 = Mar 3) and mix local time into UTC-parsed dates */
const addMonths = (dateStr, m) => {
  const [y, mo, day] = dateStr.slice(0, 10).split("-").map(Number);
  const t = mo - 1 + m, ty = y + Math.floor(t / 12), tm = ((t % 12) + 12) % 12;
  const last = new Date(Date.UTC(ty, tm + 1, 0)).getUTCDate();
  return `${ty}-${String(tm + 1).padStart(2, "0")}-${String(Math.min(day, last)).padStart(2, "0")}`;
};
/* null = QBRs not applicable (churned, or no frequency and no date set) */
function qbrStatus(a) {
  if (a.churn) return null;
  const hasFreq = a.qbrFrequency && a.qbrFrequency !== "None";

const DEFAULT_WEIGHTS = { usage: 30, sentiment: 20, tickets: 15, recency: 20, nps: 15 };
const WEIGHT_LABELS = { usage: "Product usage", sentiment: "Sentiment", tickets: "Support tickets", recency: "Engagement recency", nps: "NPS" };

const DEFAULT_INPUTS = { usage: 70, sentiment: 70, tickets: 0, nps: 0 };
/* keep health inputs numeric and in range — drops blanks/NaN, clamps the rest */
const clampInputs = raw => {
  const out = {};
  Object.keys(INPUT_RANGE).forEach(k => {
    const n = parseFloat(raw?.[k]);
    if (!isNaN(n)) { const [lo, hi] = INPUT_RANGE[k]; out[k] = Math.min(hi, Math.max(lo, n)); }
  });
  return out;
};

function lastActivityDate(accountId, activities) {
  const a = activities.filter(x => x.accountId === accountId).sort((x, y) => y.date.localeCompare(x.date));
  return a.length ? a[0].date : null;
}
function scoreComponents(acct, activities) {
  const la = lastActivityDate(acct.id, activities);
  const ds = la ? daysSince(la) : 999;
  const inp = { ...DEFAULT_INPUTS, ...clampInputs(acct.inputs) }; // tolerate missing/bad stored inputs
  return {
    usage: inp.usage,
    sentiment: inp.sentiment,
    tickets: 100 - Math.min(inp.tickets * 10, 100),
    recency: ds <= 7 ? 100 : ds >= 60 ? 0 : Math.round(100 * (1 - (ds - 7) / 53)),
    nps: Math.round((inp.nps + 100) / 2),
  };
}
function healthScore(acct, activities, weights) {
  const c = scoreComponents(acct, activities);
  const tw = Object.values(weights).reduce((a, b) => a + b, 0) || 1;
  return Math.round(Object.keys(weights).reduce((s, k) => s + (weights[k] / tw) * (c[k] ?? 0), 0));
}
const riskOf = s => (s >= 70 ? "Green" : s >= 40 ? "Yellow" : "Red");

function flagsFor(acct, activities, score) {
  if (acct.churn) return [];
  const f = [];
  const la = lastActivityDate(acct.id, activities);
  if ((!la || daysSince(la) >= 30) && daysSince(acct.startDate) >= 30) f.push("No activity 30d+");
  const dr = daysUntil(acct.renewalDate);
  if (dr >= 0 && dr < 60) f.push(`Renewal in ${dr}d`);
  const old = (acct.history || []).filter(h => daysSince(h.d) >= 25);
  if (old.length && old[old.length - 1].s - score >= 10) f.push(`Health ↓${old[old.length - 1].s - score}`);
  const iu = daysSince(acct.inputsUpdatedAt || acct.startDate);
  if (iu >= 45) f.push(`Inputs stale ${iu}d`);
  return f;
}

const AUDIT_FIELDS = ["arr", "renewalDate", "csm", "tier", "contractStatus", "renewalStage", "currency"];
/* one entry per audited field the patch really changes (numbers normalized) */
function auditChanges(a, patch, by, source) {
  const out = [];
  AUDIT_FIELDS.forEach(f => {
    if (!(f in patch)) return;

/* Prior-state capture for undo. `ids` are account ids; the snapshot also carries every
   cascaded row DELETE_ACCOUNT would remove, plus the original parentId of each sub whose
   parent is being deleted (DELETE_ACCOUNT nulls those out). */
function snapshotFor(state, ids) {
  const set = new Set(ids);
  const touches = r => set.has(r.accountId);
  const parentIds = {};
  state.accounts.filter(a => a.parentId && set.has(a.parentId)).forEach(a => { parentIds[a.id] = a.parentId; });
  return {
    accounts: state.accounts.filter(a => set.has(a.id) || parentIds[a.id]).map(a => ({ ...a })),
    contacts: state.contacts.filter(touches).map(r => ({ ...r })),
    activities: state.activities.filter(touches).map(r => ({ ...r })),
    tasks: state.tasks.filter(touches).map(r => ({ ...r })),
    opportunities: state.opportunities.filter(touches).map(r => ({ ...r })),
    parentIds,
  };
}

/* ------------------------------ store (Supabase) ------------------------------ */
const ENTITY_TABLES = ["accounts", "contacts", "activities", "tasks", "opportunities"];
const dbError = (where, error) => {
  console.error(where, error);
  const text = `Save failed (${where}): ${error.message}\nYour last change may not be shared — reload to resync.`;
  // alert() is the fallback, not the primary path: this helper can fire before
  // ToastProvider mounts, and losing a failed-save warning entirely would be worse than
  // an unstyled dialog. Deliberately kept — see the UX robustness spec.
  if (window.__toast) window.__toast({ text, tone: "error" }); else alert(text);
};

/* ------------------------------ write queue ------------------------------
   persist() used to be fire-and-forget: a failed write showed one toast and stopped, local
   state kept the change, and the user carried on editing a view the server never received
   (D1). Operations now go through this queue, which retries with backoff and -- if it
   finally gives up -- rolls the local state back by REFETCHING. Rollback by refetch rather
   than by inverting the reducer is deliberate: a refetch is unconditionally correct, while
   an undo-patch has to be right about what it is undoing, and would be a second chance to
   corrupt the same data. */
const BACKOFF_MS = [500, 2000, 8000];
const writeQueue = (() => {
  const pending = [];
  let running = false, status = "saved";
  const state = () => ({ status, pending: pending.length });
  const notify = () => window.__onQueueChange && window.__onQueueChange(state());
  const set = s => { status = s; notify(); };

  async function run() {
    if (running) return;
    running = true;
    // Strictly serial. Two edits to one account MUST NOT be in flight together, or they can
    // land out of order and the older value wins.
    while (pending.length) {
      const op = pending[0];
      let error;
      try {
        ({ error } = await sb.rpc("merge_row",
          { tbl: op.table, row_id: op.rowId, patch: op.patch, appends: op.appends }));
      } catch (e) {
        // supabase-js REJECTS on network/CORS errors rather than resolving { error }. Without
        // this the rejection escapes run(), `running` stays true forever, and every later
        // write silently no-ops at "saving" -- worse than the fire-and-forget code this
        // replaced, which only lost one write.
        error = { message: e && e.message ? e.message : String(e) };
      }
      if (!error) { pending.shift(); continue; }
      if (op.attempts < BACKOFF_MS.length) {
        await new Promise(r => setTimeout(r, BACKOFF_MS[op.attempts++]));
        continue;
      }
      // Given up. Drop everything queued -- the refetch below is about to invalidate all of
      // it -- and resync from the server.
      pending.length = 0;
      running = false;
      set("error");
      dbError(op.table, error);
      if (window.__refetch) window.__refetch();
      return;
    }
    running = false;
    set("saved");
  }

  return {
    enqueue(op) { pending.push({ ...op, attempts: 0 }); set("saving"); run().catch(e => console.error("writeQueue.run failed", e)); },
    queueState: state,
    drain: run,
  };
})();

async function fetchAll() {
  const res = await Promise.all([
    ...ENTITY_TABLES.map(t => sb.from(t).select("data")),
    sb.from("settings").select("data").eq("id", 1),
    sb.from("profiles").select("id,name,role"),
  ]);
  const bad = res.find(r => r.error);
  if (bad) throw bad.error;
  const [ac, co, act, ta, op, se] = res.slice(0, 6).map(r => r.data.map(x => x.data));
  ac.forEach(a => { if (!a.currency) a.currency = "USD"; });
  // one-time migration: give every account a stable numeric account # (used by CSV import to dedupe)
  let maxNo = ac.reduce((m, a) => Math.max(m, +a.accountNo || 0), 0);
  ac.filter(a => !a.accountNo).forEach(a => {
    a.accountNo = ++maxNo;
    sb.from("accounts").upsert({ id: a.id, data: a, updated_at: new Date().toISOString() }).then(({ error }) => error && dbError("accounts", error));
  });
  const saved = (se && se[0]) || {};
  return {
    accounts: ac, contacts: co, activities: act, tasks: ta, opportunities: op,
    team: res[6].data || [],
    settings: { weights: { ...DEFAULT_WEIGHTS, ...(saved.weights || {}) }, rates: { ...DEFAULT_RATES, ...(saved.rates || {}) },
      integrations: { processed: {}, log: [], ...(saved.integrations || {}) }, snapshots: saved.snapshots || [], playbook: saved.playbook, healthPlaybook: saved.healthPlaybook,
      segments: saved.segments || [] },
  };
}

/* Compute what actually changed between two versions of one row.
   This exists so that NO form has to diff: dispatch already holds prev and next, and this
   is the one place that sees both. It therefore also covers the appends the reducer makes
   internally -- arrEvents (crm.html:404,410,432) never passes through a form at all, so a
   form-level diff would have missed the entire audit trail. */
const sameJSON = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function diffRow(prev, next) {
  if (!prev) return { patch: { ...next }, appends: {}, sets: {} };
  const patch = {}, appends = {}, sets = {};
  for (const k of new Set([...Object.keys(prev), ...Object.keys(next)])) {
    const a = prev[k], b = next[k];
    if (sameJSON(a, b)) continue;
    if (Array.isArray(b)) {
      const base = Array.isArray(a) ? a : [];
      // An append is next == prev + trailing items, and NOTHING else. A reorder, a removal
      // or an in-place edit all break the prefix and fall through to a whole-array set --
      // misreading any of them as an append would duplicate audit entries.
      const isAppend = b.length > base.length && base.every((x, i) => sameJSON(x, b[i]));
      if (isAppend) appends[k] = b.slice(base.length); else sets[k] = b;
    } else {
      // undefined would be dropped from the JSON payload entirely, leaving the old value
      // server-side. A cleared field has to travel as an explicit null.
      patch[k] = b === undefined ? null : b;
    }
  }
  return { patch, appends, sets };
}

/* write-through: mirror a just-reduced action into Supabase */
function persist(action, next, prev) {
  const prevOf = (t, id) => ((prev && prev[t]) || []).find(x => x.id === id);
  // Write the DIFF, not the blob. Two people editing different fields of one account used
  // to revert each other with no error raised (D2); merge_row applies only what moved.
  const up = (t, item) => {
    const { patch, appends, sets } = diffRow(prevOf(t, item.id), item);
    const full = { ...patch, ...sets };
    if (!Object.keys(full).length && !Object.keys(appends).length) return;
    writeQueue.enqueue({ table: t, rowId: item.id, patch: full, appends });
  };
  switch (action.type) {
    case "ADD_ACCOUNT": { const a = next.accounts.find(x => x.id === action.item.id); return up("accounts", a || action.item); }
    case "ADD_CONTACT": return up("contacts", action.item);
    case "ADD_OPP": return up("opportunities", action.item);
    case "ADD_ACTIVITY": {
      if (action.item.type === "QBR") { const a = next.accounts.find(x => x.id === action.item.accountId); if (a && QBR_FREQ_MONTHS[a.qbrFrequency]) up("accounts", a); }
      return up("activities", action.item);
    }
    case "ADD_TASK": return up("tasks", action.item);
    case "SEED_PLAYBOOK": { action.items.forEach(t => up("tasks", t)); const a = next.accounts.find(x => x.id === action.id); return a && up("accounts", a); }
    case "SEED_HEALTH_PLAYBOOK": { action.items.forEach(t => up("tasks", t)); const a = next.accounts.find(x => x.id === action.id); return a && up("accounts", a); }
    case "TOGGLE_TASK": case "EDIT_TASK": { const t = next.tasks.find(x => x.id === action.id); return t && up("tasks", t); }
    case "EDIT_ACTIVITY": { const x = next.activities.find(v => v.id === action.id); return x && up("activities", x); }
    case "UPDATE_INPUTS": case "EDIT_ACCOUNT": case "COMPLETE_RENEWAL": case "CHURN_ACCOUNT": case "REACTIVATE_ACCOUNT": case "ADJUST_ARR": case "ADD_DOCUMENT": case "EDIT_DOCUMENT": case "DELETE_DOCUMENT": { const a = next.accounts.find(x => x.id === action.id); return a && up("accounts", a); }
    case "BULK_PATCH_ACCOUNTS": {
      const ids = new Set(action.ids);
      next.accounts.filter(a => ids.has(a.id)).forEach(a => up("accounts", a));
      return;
    }
    case "BULK_ADD_TASKS": {
      // mirror the reducer's existence filter by writing only the items it kept,
      // so a dropped orphan never reaches the database either
      const kept = new Set(next.tasks.map(t => t.id));
      return action.items.filter(t => kept.has(t.id)).forEach(t => up("tasks", t));
    }
    case "BULK_DELETE_TASKS":
      return action.ids.forEach(id => sb.from("tasks").delete().eq("id", id).then(({ error }) => error && dbError("tasks", error)));
    case "BULK_CHURN": {
      const ids = new Set(action.ids);
      next.accounts.filter(a => ids.has(a.id)).forEach(a => up("accounts", a));
      // write only the activities the reducer kept, as BULK_ADD_TASKS does
      const kept = new Set(next.activities.map(v => v.id));
      (action.activities || []).filter(v => kept.has(v.id)).forEach(v => up("activities", v));
      return;
    }
    case "BULK_DELETE_ACTIVITIES":
      return action.ids.forEach(id => sb.from("activities").delete().eq("id", id).then(({ error }) => error && dbError("activities", error)));
    case "BULK_DELETE":
      action.ids.forEach(id => {
        sb.from("accounts").delete().eq("id", id).then(({ error }) => error && dbError("accounts", error));
        ["contacts", "activities", "tasks", "opportunities"].forEach(t =>
          sb.from(t).delete().eq("data->>accountId", id).then(({ error }) => error && dbError(t, error)));
      });
      next.accounts.filter(a => a._orphaned).forEach(a => { delete a._orphaned; up("accounts", a); });
      return;
    case "RESTORE_SNAPSHOT": {
      const s = action.snapshot;
      s.accounts.forEach(a => up("accounts", a));
      ["contacts", "activities", "tasks", "opportunities"].forEach(t => s[t].forEach(r => up(t, r)));
      return;
    }
    case "SET_OPP_STAGE": { const o = next.opportunities.find(x => x.id === action.id); return o && up("opportunities", o); }
    case "DELETE_ACCOUNT":
      sb.from("accounts").delete().eq("id", action.id).then(({ error }) => error && dbError("accounts", error));
      ["contacts", "activities", "tasks", "opportunities"].forEach(t =>
        sb.from(t).delete().eq("data->>accountId", action.id).then(({ error }) => error && dbError(t, error)));
      // orphaned subs (parent just deleted) need their cleared parentId written back
      next.accounts.filter(a => a._orphaned).forEach(a => { delete a._orphaned; up("accounts", a); });
      return;
    case "SET_WEIGHTS": case "SET_RATES": case "SET_INTEGRATIONS": case "SET_SNAPSHOTS":
    case "SET_PLAYBOOK": case "SET_HEALTH_PLAYBOOK": case "SET_SEGMENTS": {
      const { patch, appends, sets } = diffRow(prev && prev.settings, next.settings);
      return writeQueue.enqueue({ table: "settings", rowId: "1", patch: { ...patch, ...sets }, appends });
    }
  }
}

/* bulk replace (sample data / clear / JSON import) — admin only, RLS enforced.
   One RPC, therefore one transaction: the deletes and inserts commit together or not at
   all. This previously deleted all five tables client-side and only then inserted, so any
   failure in between emptied the team's database with no backup. */
async function replaceAllRemote(state) {
  const payload = { settings: state.settings };
  for (const t of ENTITY_TABLES) {
    // Deliberately NOT `state[t] || []`. The old client threw a TypeError here on a
    // malformed import, which surfaced as a visible "Import failed" toast; defaulting to
    // an empty array instead would silently EMPTY that table on an irreversible operation.
    if (!Array.isArray(state[t])) throw new Error(`${t} is missing from the imported data`);
    payload[t] = state[t];
  }
  const { error } = await sb.rpc("replace_all", { payload });
  if (error) throw error;
}
function reducer(state, action) {
  switch (action.type) {

      return { ...state, accounts: [...state.accounts, item] }; }
    case "EDIT_ACCOUNT": return { ...state, accounts: state.accounts.map(a => {
      if (a.id !== action.id) return a;
      const entries = auditChanges(a, action.patch, action.by, action.source);
      let upd = withAudit({ ...a, ...action.patch }, entries);
      const arrCh = entries.find(x => x.field === "arr");
      const curCh = entries.find(x => x.field === "currency");
      const evSource = action.source === "csv import" ? "import" : "edit";
      // Changing the billing currency RESTATES the same revenue in another unit — it is not
      // expansion or contraction, and `to - from` across two currencies is not a number that
      // means anything (INR 1,000,000 -> USD 12,000 used to book a 988,000 "contraction").
      // Recorded rather than suppressed, for two reasons: the ARR audit trail exists so that
      // changes are not invisible, and a currency-only change still moves arrUSD — and with
      // it retARR and the NRR/GRR base — by the whole FX factor, which previously happened
      // with no event at all.
      if (curCh) upd = { ...upd, arrEvents: [...(a.arrEvents || []), { id: uid(), date: iso(Date.now()),
        kind: "redenomination", delta: 0, currency: curCh.to,
        fromCurrency: curCh.from, toCurrency: curCh.to,
        fromArr: arrCh ? arrCh.from : (+a.arr || 0), toArr: arrCh ? arrCh.to : (+a.arr || 0),
        source: evSource, reason: "Billing currency changed", note: "", by: curCh.by }] };
      // `a` is pre-patch, so a.currency is the one arrCh.from was denominated in.
      else if (arrCh) upd = { ...upd, arrEvents: [...(a.arrEvents || []), { id: uid(), date: iso(Date.now()), currency: a.currency,
        delta: arrCh.to - arrCh.from, kind: arrCh.to > arrCh.from ? "expansion" : "contraction",
        source: evSource, reason: "ARR edited", note: "", by: arrCh.by }] };
      return upd;
    }) };
    case "COMPLETE_RENEWAL": return { ...state, accounts: state.accounts.map(a => a.id === action.id
      // stamp the billing currency onto the entry: analytics convert historical money at
      // the currency it was BOOKED in, not at whatever the account is billed in today.
      // Stamped here rather than at each dispatch site so every caller is covered.
      ? withAudit({ ...a, renewalDate: action.newDate, arr: action.newArr, contractStatus: "Active", billingCompleted: false, billingCompletedDate: null, renewalStage: "Not started", renewals: [...(a.renewals || []), { ...action.entry, currency: action.entry.currency ?? a.currency }] },
          [ ...((+a.arr || 0) !== (+action.newArr || 0) ? [{ id: uid(), date: iso(Date.now()), field: "arr", from: +a.arr || 0, to: +action.newArr || 0, by: action.entry.by, source: "renewal" }] : []),
            ...(a.renewalDate !== action.newDate ? [{ id: uid(), date: iso(Date.now()), field: "renewalDate", from: a.renewalDate, to: action.newDate, by: action.entry.by, source: "renewal" }] : []) ])
      : a) };
    case "CHURN_ACCOUNT": return { ...state, accounts: state.accounts.map(a => a.id === action.id
      ? withAudit({ ...a, contractStatus: "Churned", churn: action.entry },
          [{ id: uid(), date: iso(Date.now()), field: "contractStatus", from: a.contractStatus, to: "Churned", by: action.entry.by, source: "churn" }]) : a) };
    case "REACTIVATE_ACCOUNT": return { ...state, accounts: state.accounts.map(a => a.id === action.id
      ? withAudit({ ...a, contractStatus: "Active", churn: null },
          [{ id: uid(), date: iso(Date.now()), field: "contractStatus", from: a.contractStatus, to: "Active", by: action.by || "unknown", source: "reactivate" }]) : a) };
    case "ADJUST_ARR": return { ...state, accounts: state.accounts.map(a => a.id === action.id
      // same currency stamp as COMPLETE_RENEWAL — covers the adjust form, opportunity-won,
      // and any future dispatcher without touching their call sites
      ? withAudit({ ...a, arr: action.newArr, arrEvents: [...(a.arrEvents || []), { ...action.entry, currency: action.entry.currency ?? a.currency }] },
          [{ id: uid(), date: iso(Date.now()), field: "arr", from: +a.arr || 0, to: +action.newArr || 0, by: action.entry.by, source: action.entry.source === "opportunity" ? "opportunity" : "adjustment" }]) : a) };
    case "ADD_DOCUMENT": return { ...state, accounts: state.accounts.map(a => {
      if (a.id !== action.id) return a;
      const label = `${action.doc.category}: ${action.doc.title || action.doc.name}`;
      return withAudit({ ...a, documents: [...(a.documents || []), action.doc] },
        [{ id: uid(), date: iso(Date.now()), field: "document", from: "", to: label, by: action.by || "unknown", source: action.source || "upload" }]);
    }) };
    case "EDIT_DOCUMENT": return { ...state, accounts: state.accounts.map(a => {
      if (a.id !== action.id) return a;

      if (!doc) return a;

      const to = `${updated.category}: ${updated.title || updated.name}`;
      return withAudit({ ...a, documents: (a.documents || []).map(d => d.id === action.docId ? updated : d) },
        [{ id: uid(), date: iso(Date.now()), field: "document", from, to, by: action.by || "unknown", source: action.source || "edit" }]);
    }) };
    case "DELETE_DOCUMENT": return { ...state, accounts: state.accounts.map(a => {
      if (a.id !== action.id) return a;
      const doc = (a.documents || []).find(d => d.id === action.docId);
      if (!doc) return a;
      const label = `${doc.category}: ${doc.title || doc.name}`;
      return withAudit({ ...a, documents: (a.documents || []).filter(d => d.id !== action.docId) },
        [{ id: uid(), date: iso(Date.now()), field: "document", from: label, to: "", by: action.by || "unknown", source: action.source || "delete" }]);
    }) };
    case "SET_OPP_STAGE": return { ...state, opportunities: state.opportunities.map(o => o.id === action.id ? { ...o, stage: action.stage } : o) };
    case "DELETE_ACCOUNT": return { ...state,
      // _orphaned marks subs whose parent was just deleted so persist() can write them back
      accounts: state.accounts.filter(a => a.id !== action.id).map(a => a.parentId === action.id ? { ...a, parentId: null, _orphaned: true } : a),
      contacts: state.contacts.filter(c => c.accountId !== action.id),
      activities: state.activities.filter(x => x.accountId !== action.id),
      tasks: state.tasks.filter(t => t.accountId !== action.id),
      opportunities: state.opportunities.filter(o => o.accountId !== action.id) };
    case "ADD_CONTACT": return { ...state, contacts: [...state.contacts, action.item] };
    case "ADD_OPP": return { ...state, opportunities: [...state.opportunities, action.item] };
    case "ADD_ACTIVITY": {
      let accounts = state.accounts;
      if (action.item.type === "QBR") { // logging a QBR schedules the next one per the account's cadence
        accounts = accounts.map(a => {
          if (a.id !== action.item.accountId) return a;
          const m = QBR_FREQ_MONTHS[a.qbrFrequency];

        });
      }
      return { ...state, accounts, activities: [...state.activities, action.item] };
    }
    case "EDIT_ACTIVITY": return { ...state, activities: state.activities.map(x => x.id === action.id ? { ...x, ...action.patch } : x) };
    case "ADD_TASK": return { ...state, tasks: [...state.tasks, action.item] };
    case "EDIT_TASK": return { ...state, tasks: state.tasks.map(t => t.id === action.id ? { ...t, ...action.patch } : t) };
    case "TOGGLE_TASK": return { ...state, tasks: state.tasks.map(t => t.id === action.id ? { ...t, status: t.status === "Done" ? "Open" : "Done" } : t) };
    case "UPDATE_INPUTS": {
      return { ...state, accounts: state.accounts.map(a => {
        if (a.id !== action.id) return a;
        const upd = { ...a, inputs: { ...a.inputs, ...clampInputs(action.inputs) }, inputsUpdatedAt: iso(Date.now()) };
        const s = healthScore(upd, state.activities, state.settings.weights);

            churn: { date: action.date, reason: action.reason, note: action.note || "", arr: a.arr, currency: a.currency, by: action.by } },

        // _orphaned marks subs whose parent was just deleted so persist() writes them back
        accounts: state.accounts.filter(a => !ids.has(a.id))
          .map(a => (a.parentId && ids.has(a.parentId)) ? { ...a, parentId: null, _orphaned: true } : a),

        contacts: merge(state.contacts, s.contacts),
        activities: merge(state.activities, s.activities),

    case "SET_RATES": return { ...state, settings: { ...state.settings, rates: action.rates } };
    case "SET_INTEGRATIONS": return { ...state, settings: { ...state.settings, integrations: action.integrations } };
    case "SET_SNAPSHOTS": return { ...state, settings: { ...state.settings, snapshots: action.snapshots } };
    case "SET_PLAYBOOK": return { ...state, settings: { ...state.settings, playbook: action.playbook } };
    case "SET_SEGMENTS": return { ...state, settings: { ...state.settings, segments: action.segments } };
    case "SEED_PLAYBOOK": return { ...state,
      tasks: [...state.tasks, ...action.items],
      accounts: state.accounts.map(a => a.id === action.id ? { ...a, playbookSeededFor: action.seededFor } : a) };

  { id: "pb14", title: "Contract out for signature", offsetDays: 14, priority: "High" },
  { id: "pb7", title: "Confirm signature & billing", offsetDays: 7, priority: "High" },
];

const DEFAULT_HEALTH_PLAYBOOK = {
  Yellow: [
    { id: "hy1", title: "Schedule check-in call with account", dueDays: 3, priority: "Medium" },
    { id: "hy2", title: "Review usage & recent activity for decline drivers", dueDays: 5, priority: "Medium" },
    { id: "hy3", title: "Confirm champion still engaged", dueDays: 7, priority: "Low" },
  ],

    { id: "hr3", title: "Draft recovery plan & risk summary", dueDays: 5, priority: "High" },
  ],
};
const healthPlaybookOf = settings => settings.healthPlaybook || DEFAULT_HEALTH_PLAYBOOK;
/* Accounts eligible for the one-time playbook backfill: every live at-risk account.
 * Re-seeds accounts that already have a playbook (deliberate — see the 2026-08-11 spec). */
const backfillCandidates = scored => scored.filter(a => !a.churn && (a.risk === "Yellow" || a.risk === "Red"));

/* ------------------------------ task queue ------------------------------ */
const PRIORITY_RANK = { High: 0, Medium: 1, Low: 2 };
/* Buckets tasks for the work queue. `today` is an ISO YYYY-MM-DD string; comparing two
 * UTC-midnight timestamps keeps this deterministic (daysUntil compares against Date.now(),
 * which makes results depend on the time of day the suite happens to run). */
const bucketTasks = (tasks, today) => {
  const out = { overdue: [], today: [], week: [], later: [], done: [] };
  const t0 = new Date(today).getTime();
  tasks.forEach(t => {
    if (t.status === "Done") { out.done.push(t); return; }
    if (!t.due) { out.later.push(t); return; }        // guards imported/hand-edited rows
    const d = Math.round((new Date(t.due).getTime() - t0) / DAY);
    if (d < 0) out.overdue.push(t);
    else if (d === 0) out.today.push(t);
    else if (d <= 7) out.week.push(t);
    else out.later.push(t);
  });
  const cmp = (a, b) => (a.due || "9999-99-99").localeCompare(b.due || "9999-99-99")
    || (PRIORITY_RANK[a.priority] ?? 3) - (PRIORITY_RANK[b.priority] ?? 3);
  Object.keys(out).forEach(k => out[k].sort(cmp));
  return out;

function Sparkline({ points, w = 220, h = 48 }) {

function TrendLine({ label, points, months, fmt, w = 150, h = 28 }) {
  const vals = points.map(v => v === null || v === undefined ? null : +v);

/* full line chart: gridlines, axis labels, hover tooltip (snapshots are monthly) */
function LineChart({ title, points, months, fmt, color = "#6366f1", w = 340, h = 160 }) {
  const [hov, setHov] = useState(null);
  const vals = points.map(v => v === null || v === undefined ? null : +v);
  const nums = vals.filter(v => v !== null);
  if (nums.length < 2) return null;
  const min = Math.min(...nums), max = Math.max(...nums);
  const padL = 44, padR = 10, padT = 14, padB = 22;
  const X = i => padL + (i * (w - padL - padR)) / Math.max(vals.length - 1, 1);
  const Y = v => padT + (1 - (v - min) / (max - min || 1)) * (h - padT - padB);
  const xy = vals.map((v, i) => v === null ? null : [X(i), Y(v)]);
  const d = xy.filter(Boolean).map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const ticks = [min, (min + max) / 2, max];
  const lblEvery = Math.ceil(months.length / 6);
  const move = e => {
    const box = e.currentTarget.getBoundingClientRect();
    const fx = (e.clientX - box.left) * (w / box.width);
    let best = 0; vals.forEach((v, i) => { if (v !== null && Math.abs(X(i) - fx) < Math.abs(X(best) - fx)) best = i; });
    setHov(vals[best] === null ? null : best);
  };
  return (
    <div>
      <div className="mb-1 text-xs font-bold text-slate-500">{title}</div>
      <svg viewBox={`0 0 ${w} ${h}`} className="w-full" onMouseMove={move} onMouseLeave={() => setHov(null)}>
        {ticks.map((t, i) => <g key={i}>
          <line x1={padL} x2={w - padR} y1={Y(t)} y2={Y(t)} stroke="#e2e8f0" strokeWidth="1" />
          <text x={padL - 4} y={Y(t) + 3} textAnchor="end" fontSize="9" fill="#94a3b8">{fmt(t)}</text>
        </g>)}
        {months.map((m, i) => i % lblEvery === 0 && <text key={m} x={X(i)} y={h - 8} textAnchor="middle" fontSize="9" fill="#94a3b8">{m.slice(2)}</text>)}
        <path d={d} fill="none" stroke={color} strokeWidth="2" />
        {xy.map((p, i) => p && <circle key={i} cx={p[0]} cy={p[1]} r={hov === i ? 4 : 2.5} fill={color} />)}
        {hov !== null && xy[hov] && <g>
          <line x1={xy[hov][0]} x2={xy[hov][0]} y1={padT} y2={h - padB} stroke="#cbd5e1" strokeDasharray="3 3" />
          <rect x={Math.min(xy[hov][0] + 6, w - 96)} y={padT} width="90" height="28" rx="4" fill="#0f172a" opacity="0.85" />
          <text x={Math.min(xy[hov][0] + 6, w - 96) + 6} y={padT + 12} fontSize="9" fill="#e2e8f0">{months[hov]}</text>
          <text x={Math.min(xy[hov][0] + 6, w - 96) + 6} y={padT + 23} fontSize="10" fontWeight="bold" fill="#fff">{fmt(vals[hov])}</text>
        </g>}
      </svg>
    </div>
  );
}
/* stacked bars of per-month counts (e.g. Green/Yellow/Red account mix) */
function StackedBars({ months, series, w = 340, h = 160 }) {
  const [hov, setHov] = useState(null);
  if (!months.length) return null;
  const totals = months.map((_, i) => series.reduce((s, sr) => s + (sr.values[i] || 0), 0));
  const max = Math.max(...totals, 1);
  const padL = 30, padR = 10, padT = 14, padB = 22;
  const bw = Math.min(24, ((w - padL - padR) / months.length) * 0.7);
  const X = i => padL + ((i + 0.5) * (w - padL - padR)) / months.length;
  const H = v => (v / max) * (h - padT - padB);
  const lblEvery = Math.ceil(months.length / 6);
  return (
    <div>
      <div className="mb-1 flex items-center gap-3 text-xs font-bold text-slate-500">Health mix (accounts)
        {series.map(sr => <span key={sr.label} className="flex items-center gap-1 font-normal"><span className="inline-block h-2 w-2 rounded-sm" style={{ background: sr.color }} />{sr.label}</span>)}
      </div>
      <svg viewBox={`0 0 ${w} ${h}`} className="w-full" onMouseLeave={() => setHov(null)}>
        <text x={padL - 4} y={padT + 3} textAnchor="end" fontSize="9" fill="#94a3b8">{max}</text>
        <line x1={padL} x2={w - padR} y1={h - padB} y2={h - padB} stroke="#e2e8f0" />
        {months.map((m, i) => {
          let y = h - padB;
          return (
            <g key={m} onMouseEnter={() => setHov(i)}>
              {series.map(sr => { const bh = H(sr.values[i] || 0); y -= bh;
                return <rect key={sr.label} x={X(i) - bw / 2} y={y} width={bw} height={bh} fill={sr.color} opacity={hov === null || hov === i ? 1 : 0.4} />; })}
              {i % lblEvery === 0 && <text x={X(i)} y={h - 8} textAnchor="middle" fontSize="9" fill="#94a3b8">{m.slice(2)}</text>}
            </g>
          );
        })}
        {hov !== null && <g>
          <rect x={Math.min(X(hov) + 6, w - 120)} y={padT} width="114" height={14 + series.length * 11} rx="4" fill="#0f172a" opacity="0.85" />
          <text x={Math.min(X(hov) + 6, w - 120) + 6} y={padT + 11} fontSize="9" fill="#e2e8f0">{months[hov]} · {totals[hov]} accounts</text>
          {series.map((sr, si) => <text key={sr.label} x={Math.min(X(hov) + 6, w - 120) + 6} y={padT + 22 + si * 11} fontSize="9" fill={sr.color}>{sr.label}: {sr.values[hov] || 0}</text>)}
        </g>}
      </svg>
    </div>
  );
}

const ToastCtx = React.createContext(() => {});
const useToast = () => useContext(ToastCtx);
const TOAST_TONE = {
  info: "border-slate-300 text-slate-800",
  success: "border-emerald-300 text-emerald-800",
  error: "border-rose-300 text-rose-700",
};
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const timers = useRef({});
  const dismiss = useCallback(id => {
    clearTimeout(timers.current[id]); delete timers.current[id];
    setToasts(ts => ts.filter(t => t.id !== id));
  }, []);
  const pushToast = useCallback(({ text, tone = "info", undo }) => {
    const id = uid();
    // errors never auto-dismiss: a failed write may not have reached the team
    setToasts(ts => [...ts, { id, text, tone, undo }].slice(-3));
    if (tone !== "error") timers.current[id] = setTimeout(() => dismiss(id), undo ? 10000 : 5000);
    return id;
  }, [dismiss]);
  useEffect(() => () => Object.values(timers.current).forEach(clearTimeout), []);
  useEffect(() => { window.__toast = pushToast; }, [pushToast]);
  return (
    <ToastCtx.Provider value={pushToast}>
      {children}
      <div className="fixed bottom-4 right-4 z-[60] flex w-80 flex-col gap-2" aria-live="polite">
        {toasts.map(t => (
          <div key={t.id} data-toast data-tone={t.tone} role={t.tone === "error" ? "alert" : "status"}
               className={`nm flex items-start gap-2 border-l-4 p-3 text-sm ${TOAST_TONE[t.tone]}`}>
            <span className="flex-1 whitespace-pre-line">{t.text}</span>
            {t.undo && <button data-toast-undo className="font-bold text-indigo-600 hover:underline"
              onClick={() => { t.undo(); dismiss(t.id); }}>Undo</button>}
            <button aria-label="Dismiss notification" className="text-slate-400 hover:text-slate-700"
              onClick={() => dismiss(t.id)}>✕</button>
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}

const MAX_FILE_MB = 10;
async function uploadFiles(fileList, accountId) {
  const out = [];
  for (const f of Array.from(fileList || [])) {
    if (f.size > MAX_FILE_MB * 1024 * 1024) throw new Error(`${f.name} is over ${MAX_FILE_MB} MB`);
    const path = `${accountId}/${Date.now()}-${f.name.replace(/[^\w.\-]+/g, "_")}`;
    const { error } = await sb.storage.from("attachments").upload(path, f);
    if (error) throw new Error(`${f.name}: ${error.message}`);
    const { data } = sb.storage.from("attachments").getPublicUrl(path);
    out.push({ name: f.name, url: data.publicUrl, path });
  }
  return out;
}

const DOC_CATEGORIES = ["Contract", "PO", "Advisory", "QBR", "Others"];

const EXPIRY_WARN_DAYS = 60;
function DocumentForm({ acct, dispatch, user, onDone, existing }) {
  const fileRef = useRef(null);
  const [category, setCategory] = useState(existing ? existing.category : "");
  const [title, setTitle] = useState(existing ? existing.title || "" : "");
  const [amount, setAmount] = useState(existing && existing.amount != null ? String(existing.amount) : "");
  const [effectiveDate, setEffectiveDate] = useState(existing ? existing.effectiveDate || "" : "");
  const [expiryDate, setExpiryDate] = useState(existing ? existing.expiryDate || "" : "");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const submit = async e => {
    e.preventDefault();
    if (busy) return;
    const files = fileRef.current?.files;
    const hasNewFile = files && files.length;
    if (!category) { setErr("Choose a category."); return; }
    if (!existing && !hasNewFile) { setErr("Choose a file."); return; }
    setBusy(true); setErr("");
    try {
      const meta = { category, title: title.trim(),
        amount: Number.isFinite(+amount) && amount !== "" ? +amount : null, effectiveDate: effectiveDate || null, expiryDate: expiryDate || null };
      if (existing) {
        const patch = { ...meta };
        if (hasNewFile) {
          const [uploaded] = await uploadFiles(files, acct.id);
          patch.name = uploaded.name; patch.url = uploaded.url; patch.path = uploaded.path;
          if (sb && existing.path && existing.path !== uploaded.path) { try { await sb.storage.from("attachments").remove([existing.path]); } catch {} }
        }
        dispatch({ type: "EDIT_DOCUMENT", id: acct.id, docId: existing.id, patch, by: user?.name, source: "edit" });
      } else {
        const [uploaded] = await uploadFiles(files, acct.id);
        const doc = { id: uid(), ...meta, name: uploaded.name, url: uploaded.url, path: uploaded.path,
          uploadedBy: user?.name || "unknown", uploadedAt: iso(Date.now()) };
        dispatch({ type: "ADD_DOCUMENT", id: acct.id, doc, by: user?.name, source: "upload" });
      }
      onDone();
    } catch (ex) { setErr(ex.message || String(ex)); setBusy(false); }
  };
  return (
    <form onSubmit={submit} className="space-y-2">
      <div className="grid gap-2 sm:grid-cols-2">
        <select value={category} onChange={e => setCategory(e.target.value)} required

        <label className="text-xs text-slate-500">Effective<Input type="date" value={effectiveDate} onChange={e => setEffectiveDate(e.target.value)} /></label>
        <label className="text-xs text-slate-500">Expiry<Input type="date" value={expiryDate} onChange={e => setExpiryDate(e.target.value)} /></label>
      </div>
      {err && <div className="text-xs font-semibold text-rose-600">{err}</div>}
      <div className="flex gap-2">
        <Btn kind="primary" type="submit">{busy ? (existing ? "Saving…" : "Uploading…") : (existing ? "Save changes" : "Upload document")}</Btn>
        <Btn onClick={onDone}>Cancel</Btn>
      </div>
    </form>
  );
}

/* ------------------------------- Dashboard ------------------------------- */
/* trailing-12-month revenue retention (USD) from churn events, renewal deltas and ARR events */
function retentionStats(accounts, rates) {
  const yearAgo = Date.now() - 365 * DAY;
  let churnedARR = 0, expansion = 0, contraction = 0;
  accounts.forEach(a => {
    if (a.churn && new Date(a.churn.date).getTime() >= yearAgo) churnedARR += toUSD(a.churn.arr, a.churn.currency || a.currency, rates);
    (a.renewals || []).forEach(r => {
      if (new Date(r.completedOn).getTime() >= yearAgo) {
        const d = toUSD(r.arr - r.prevArr, r.currency || a.currency, rates);
        if (d >= 0) expansion += d; else contraction -= d;
      }
    });
    (a.arrEvents || []).forEach(ev => { // won opportunities + manual ARR adjustments
      // a currency restatement is not revenue movement. Skipped explicitly rather than
      // relying on its delta being 0, so the intent is legible and a future non-zero
      // delta cannot leak into NRR.
      if (ev.kind === "redenomination") return;
      if (new Date(ev.date).getTime() >= yearAgo) {
        const d = toUSD(ev.delta, ev.currency || a.currency, rates);
        if (d >= 0) expansion += d; else contraction -= d;
      }
    });
  });
  const retARR = accounts.reduce((s, a) => s + (a.churn ? 0 : a.arrUSD), 0);
  const base = retARR + churnedARR - expansion + contraction;
  return { churnedARR, expansion, contraction,
    grr: base > 0 ? (base - churnedARR - contraction) / base : null,
    nrr: base > 0 ? (base - churnedARR - contraction + expansion) / base : null,
    lost: accounts.filter(a => a.churn && new Date(a.churn.date).getTime() >= yearAgo).length };
}

/* ---------------------------- cohort retention ---------------------------- */
const monthsBetween = (a, b) => (new Date(b).getFullYear() - new Date(a).getFullYear()) * 12 + (new Date(b).getMonth() - new Date(a).getMonth());
const quarterKey = d => { // ISO strings parsed textually (timezone-safe); Dates read in local time
  const [y, m] = typeof d === "string" ? d.split("-").map(Number) : [d.getFullYear(), d.getMonth() + 1];
  return y + "-Q" + (Math.ceil(m / 3));
};
function cohortData(accounts) {
  const now = iso(Date.now());
  const threeYrsAgo = new Date(); threeYrsAgo.setFullYear(threeYrsAgo.getFullYear() - 3);
  const rows = new Map(); // key -> { key, start (earliest startDate), accts: [] }
  accounts.forEach(a => {
    if (!a.startDate || isNaN(new Date(a.startDate))) return;
    const d = new Date(a.startDate);
    const key = d < threeYrsAgo ? String(d.getFullYear()) : `${d.getFullYear()}-Q${Math.floor(d.getMonth() / 3) + 1}`;
    if (!rows.has(key)) rows.set(key, { key, start: a.startDate, accts: [] });
    const r = rows.get(key);
    if (a.startDate < r.start) r.start = a.startDate;
    // quarters survived: Infinity if never churned
    r.accts.push({ arr: a.arrUSD || 0, surv: a.churn && a.churn.date ? Math.max(0, Math.floor(monthsBetween(a.startDate, a.churn.date) / 3)) : Infinity });
  });

/* ---------------------------- churn analysis ---------------------------- */
const CHURN_DIMS = ["Reason", "CSM", "Tier", "Quarterly"];
function churnRows(accounts, rates, dim, now = new Date()) {
  const m = new Map();
  accounts.filter(a => a.churn).forEach(a => {
    const lost = toUSD(a.churn.arr || 0, a.churn.currency || a.currency, rates);
    const k = dim === "Reason" ? (a.churn.reason || "Other")
      : dim === "CSM" ? (a.csm || "Unassigned")
      : dim === "Tier" ? (a.tier || "—")
      : quarterKey(a.churn.date);
    const r = m.get(k) || { k, n: 0, arr: 0 };
    r.n++; r.arr += lost; m.set(k, r);
  });
  if (dim !== "Quarterly") return [...m.values()].sort((x, y) => y.arr - x.arr);
  // Quarterly: last 8 quarters, chronological, zero-filled
  const keys = [];
  for (let i = 7; i >= 0; i--) keys.push(quarterKey(new Date(now.getFullYear(), now.getMonth() - i * 3, 1)));
  return keys.map(k => m.get(k) || { k, n: 0, arr: 0 });
}
function ChurnAnalysis({ accounts, rates }) {
  const [dim, setDim] = useState("Reason");
  const rows = useMemo(() => churnRows(accounts, rates, dim), [accounts, rates, dim]);
  const total = rows.reduce((s, r) => s + r.arr, 0);
  const max = Math.max(...rows.map(r => r.arr), 1);
  return (
    <Card title={`Churn analysis${total ? ` · ${fmtMoney(total)} lost` : ""}`} className="!p-3" right={
      <div className="flex items-center gap-1 text-xs">
        {CHURN_DIMS.map(d => <button key={d} onClick={() => setDim(d)}
          className={`rounded-full px-2.5 py-0.5 font-bold ${dim === d ? "bg-indigo-100 text-indigo-700" : "text-slate-500 hover:text-slate-700"}`}>{d}</button>)}
      </div>}>
      {rows.length === 0 && <div className="text-sm text-slate-500">No churn recorded. 🎉</div>}
      {rows.map(r => (
        <div key={r.k} className="flex items-center gap-3 py-1 text-sm">
          <span className="w-28 shrink-0 font-semibold text-slate-700">{r.k}</span>
          <div className="h-3 flex-1 rounded bg-slate-100">
            <div className="h-3 rounded bg-rose-400" style={{ width: `${(100 * r.arr) / max}%` }} />
          </div>
          <span className="w-24 shrink-0 text-right text-xs text-slate-600">{r.n ? `${r.n} acct${r.n > 1 ? "s" : ""}` : "—"}</span>
          <span className="w-20 shrink-0 text-right text-xs font-bold text-rose-600">{r.arr ? fmtMoney(r.arr) : "—"}</span>
        </div>
      ))}
    </Card>
  );
}

/* ----------------------- renewal outcomes by quarter ----------------------- */
function renewalOutcomeRows(accounts, rates, snapshots, now = new Date()) {
  return [4, 3, 2, 1, 0].map(off => {
    const startMonth = Math.floor(now.getMonth() / 3) * 3 - off * 3;
    const start = new Date(now.getFullYear(), startMonth, 1);
    const end = new Date(now.getFullYear(), startMonth + 3, 1);
    const mkey = x => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}`;
    const startKey = mkey(start), endKey = mkey(end);
    const inQ = d => { const k = String(d).slice(0, 7); return k >= startKey && k < endKey; };
    let renewed = 0, renewedN = 0, churned = 0, churnedN = 0, slipped = 0;
    accounts.forEach(a => {
      (a.renewals || []).forEach(r => { if (r.completedOn && inQ(r.completedOn)) { renewed += toUSD(r.arr || 0, r.currency || a.currency, rates); renewedN++; } });
      if (a.churn && inQ(a.churn.date)) { churned += toUSD(a.churn.arr || 0, a.churn.currency || a.currency, rates); churnedN++; }
      if (!a.churn && inQ(a.renewalDate) && daysUntil(a.renewalDate) < 0
          && !(a.renewals || []).some(r => r.completedOn && r.completedOn >= a.renewalDate)) slipped++;
    });
    const snap = (snapshots || []).find(s => s.month === startKey && s.commit90 !== undefined);
    const wr = renewed + churned > 0 ? renewed / (renewed + churned) : null;
    return { key: quarterKey(start), renewed, renewedN, churned, churnedN, slipped, wr,
      forecast: snap ? snap.commit90 : null, current: off === 0 };
  });
}
function RenewalOutcomes({ accounts, rates, snapshots }) {
  const rows = useMemo(() => renewalOutcomeRows(accounts, rates, snapshots), [accounts, rates, snapshots]);
  const firstForecast = (snapshots || []).find(s => s.commit90 !== undefined);
  const anyForecast = rows.some(r => r.forecast !== null);
  const wrChip = wr => wr === null ? <span className="text-slate-400">—</span>
    : <span className={`rounded-full px-2 py-0.5 text-xs font-bold ${wr >= 0.9 ? "bg-emerald-100 text-emerald-700" : wr >= 0.75 ? "bg-amber-100 text-amber-700" : "bg-rose-100 text-rose-600"}`}>{Math.round(100 * wr)}%</span>;
  return (
    <Card title="Renewal outcomes by quarter" className="!p-3">
      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead><tr className="border-b border-slate-200 text-[11px] font-bold uppercase tracking-widest text-slate-500">
            <th className="px-2 py-1.5 text-left">Quarter</th>
            <th className="px-2 py-1.5 text-right">Renewed</th>
            <th className="px-2 py-1.5 text-right">Churned</th>
            <th className="px-2 py-1.5 text-right">Slipped</th>
            <th className="px-2 py-1.5 text-right">Win rate</th>
            {anyForecast && <th className="px-2 py-1.5 text-right">Forecast (commit)</th>}
          </tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.key} className="border-b border-slate-100 last:border-0">
                <td className="px-2 py-1.5 font-semibold text-slate-700">{r.key}{r.current && <span className="ml-1 text-[11px] font-normal text-slate-400">(so far)</span>}</td>
                <td className="px-2 py-1.5 text-right">{r.renewedN ? <span className="text-emerald-700">{fmtMoney(r.renewed)} <span className="text-xs text-slate-500">· {r.renewedN}</span></span> : "—"}</td>
                <td className="px-2 py-1.5 text-right">{r.churnedN ? <span className="text-rose-600">{fmtMoney(r.churned)} <span className="text-xs text-slate-500">· {r.churnedN}</span></span> : "—"}</td>
                <td className="px-2 py-1.5 text-right">{r.slipped || "—"}</td>
                <td className="px-2 py-1.5 text-right">{wrChip(r.wr)}</td>
                {anyForecast && <td className="px-2 py-1.5 text-right text-xs">{r.forecast === null ? "—"
                  : <span>{fmtMoney(r.forecast)} <span className={r.renewed >= r.forecast ? "text-emerald-600" : "text-rose-600"}>({r.renewed >= r.forecast ? "+" : "−"}{fmtMoney(Math.abs(r.renewed - r.forecast))})</span></span>}</td>}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {!anyForecast && <p className="mt-2 text-xs text-slate-500">
        Forecast tracking started {firstForecast ? new Date(firstForecast.month + "-15").toLocaleDateString("en-US", { month: "long", year: "numeric" }) : "this month"} — accuracy appears after a full quarter.</p>}
    </Card>
  );
}

/* sub-account display numbers: parentNo.1, parentNo.2, … ordered by the subs' own account # */
function subNumbers(accounts) {
  const m = new Map(), byP = new Map();
  accounts.forEach(a => { if (a.parentId) byP.set(a.parentId, [...(byP.get(a.parentId) || []), a]); });
  byP.forEach((list, pid) => {
    const p = accounts.find(x => x.id === pid); if (!p) return;
    [...list].sort((x, y) => (+x.accountNo || 0) - (+y.accountNo || 0)).forEach((s, i) => m.set(s.id, `${p.accountNo}.${i + 1}`));
  });
  return m;
}
function accountsCSVText(rows) {
  const cols = ["accountNo", "name", "tier", "arr", "currency", "arrUSD", "industry", "csm", "startDate", "renewalDate", "daysToRenewal", "score", "risk", "contractStatus", "modules", "licenses", "dedicatedSupport", "billingCompleted", "billingCompletedDate"];
  const esc = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const cell = (a, c) => c === "daysToRenewal" ? daysUntil(a.renewalDate) : c === "arrUSD" ? Math.round(a.arrUSD) : c === "dedicatedSupport" ? (a.dedicatedSupport ? "Yes" : "No") : c === "billingCompleted" ? (a.billingCompleted ? "Yes" : "No") : a[c];
  return [cols.join(","), ...rows.map(a => cols.map(c => esc(cell(a, c))).join(","))].join("\n");
}
function exportCSV(rows) {
  const url = URL.createObjectURL(new Blob([accountsCSVText(rows)], { type: "text/csv" }));
  const el = Object.assign(document.createElement("a"), { href: url, download: "accounts.csv" });
  el.click(); URL.revokeObjectURL(url);
}
function parseCSV(text) {
  const rows = []; let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ",") { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); rows.push(row); row = []; cur = "";
    } else cur += ch;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
function importAccountsCSV(file, accounts, dispatch, done, user) {
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCSV(String(reader.result));
    if (rows.length < 2) return done({ ok: 0, updated: 0, skipped: 0, badTier: 0, badStatus: 0, err: "No data rows found — the first row must be a header (name, tier, arr, …)." });
    const norm = s => s.toLowerCase().replace(/[^a-z]/g, "");
    const header = rows[0].map(norm);
    const has = key => header.indexOf(key) >= 0;
    const col = (r, key) => { const i = header.indexOf(key); return i >= 0 ? (r[i] || "").trim() : ""; };
    if (!has("name")) return done({ ok: 0, updated: 0, skipped: 0, badTier: 0, badStatus: 0, err: 'The header row needs a "name" column (matching Export CSV format works).' });
    // dedupe: match on accountNo first, then case-insensitive name — matched rows update the existing account
    const byNo = new Map(accounts.filter(a => a.accountNo).map(a => [String(a.accountNo), a]));
    const byName = new Map(accounts.map(a => [a.name.toLowerCase(), a]));
    let ok = 0, updated = 0, skipped = 0, badTier = 0, badStatus = 0;
    rows.slice(1).forEach(r => {
      const name = col(r, "name");
      if (!name) { skipped++; return; }
      const num = (key, dflt) => { const v = parseFloat(col(r, key)); return isNaN(v) ? dflt : v; };
      const date = v => { const d = new Date(v); return v && !isNaN(d) ? iso(d.getTime()) : null; };
      const vals = { name };
      if (has("tier")) {
        const raw = col(r, "tier");
        const match = ["Enterprise", "Mid", "SMB"].find(t => t.toLowerCase() === raw.toLowerCase());
        // an empty cell is a missing value, not a mis-typed one -- don't report it
        if (raw && !match) badTier++;
        vals.tier = match || "Mid";
      }
      if (has("arr")) vals.arr = Math.max(0, num("arr", 0));
      if (has("currency")) vals.currency = CURRENCIES.includes(col(r, "currency").toUpperCase()) ? col(r, "currency").toUpperCase() : "USD";
      if (has("industry")) vals.industry = col(r, "industry");
      if (has("csm")) vals.csm = col(r, "csm");
      if (has("startdate") && date(col(r, "startdate"))) vals.startDate = date(col(r, "startdate"));
      if (has("renewaldate") && date(col(r, "renewaldate"))) vals.renewalDate = date(col(r, "renewaldate"));
      if (has("contractstatus")) {
        const raw = col(r, "contractstatus");
        const match = ["Active", "Auto-renew", "In negotiation", "Churn risk"].find(s => s.toLowerCase() === raw.toLowerCase());
        if (raw && !match) badStatus++;
        vals.contractStatus = match || "Active";
      }
      if (has("modules")) vals.modules = col(r, "modules");
      if (has("licenses")) vals.licenses = Math.max(0, num("licenses", 0));
      if (has("dedicatedsupport")) vals.dedicatedSupport = ["yes", "true", "y", "1"].includes(col(r, "dedicatedsupport").toLowerCase());
      if (has("billingcompleted")) vals.billingCompleted = ["yes", "true", "y", "1"].includes(col(r, "billingcompleted").toLowerCase());
      if (has("billingcompleteddate") && date(col(r, "billingcompleteddate"))) vals.billingCompletedDate = date(col(r, "billingcompleteddate"));
      const inputPatch = clampInputs({ usage: col(r, "usage"), sentiment: col(r, "sentiment"), tickets: col(r, "tickets"), nps: col(r, "nps") });
      const no = +col(r, "accountno") || 0;
      const existing = (no && byNo.get(String(no))) || byName.get(name.toLowerCase());
      if (existing) {
        dispatch({ type: "EDIT_ACCOUNT", id: existing.id, patch: vals, by: user?.name, source: "csv import" });
        // health columns update the score too (recomputes and logs history, like ✎ Update health)
        if (Object.keys(inputPatch).length) dispatch({ type: "UPDATE_INPUTS", id: existing.id, inputs: inputPatch });
        updated++;
      } else {
        const item = { id: uid(), tier: "Mid", arr: 0, currency: "USD", industry: "", csm: "",
          startDate: iso(Date.now()), renewalDate: addDays(365), contractStatus: "Active",
          modules: "", licenses: 0, dedicatedSupport: false, ...vals, ...(no ? { accountNo: no } : {}),
          inputs: { ...DEFAULT_INPUTS, ...inputPatch },
          history: [], inputsUpdatedAt: iso(Date.now()) };
        dispatch({ type: "ADD_ACCOUNT", item });
        byName.set(name.toLowerCase(), item);
        if (no) byNo.set(String(no), item);
        ok++;
      }
    });
    done({ ok, updated, skipped, badTier, badStatus });
  };
  reader.readAsText(file);
}
/* finance CSV: accountNo and/or name + billingCompletedDate — marks billing completed */
function importBillingCSV(text, accounts, dispatch) {
  const rows = parseCSV(text);
  if (rows.length < 2) return { updated: 0, skipped: 0, err: "no data rows" };
  const norm = s => s.toLowerCase().replace(/[^a-z]/g, "");
  const header = rows[0].map(norm);
  const col = (r, key) => { const i = header.indexOf(key); return i >= 0 ? (r[i] || "").trim() : ""; };
  if (header.indexOf("billingcompleteddate") < 0) return { updated: 0, skipped: 0, err: 'needs a "billingCompletedDate" column' };
  const byNo = new Map(accounts.filter(a => a.accountNo).map(a => [String(a.accountNo), a]));
  const byName = new Map(accounts.map(a => [a.name.toLowerCase(), a]));
  let updated = 0, skipped = 0;
  rows.slice(1).forEach(r => {
    const d = new Date(col(r, "billingcompleteddate"));
    const acct = (col(r, "accountno") && byNo.get(col(r, "accountno"))) || byName.get(col(r, "name").toLowerCase());
    if (!acct || isNaN(d)) { skipped++; return; }
    dispatch({ type: "EDIT_ACCOUNT", id: acct.id, patch: { billingCompleted: true, billingCompletedDate: iso(d.getTime()) } });
    updated++;
  });
  return { updated, skipped };
}

const FS_SUPPORTED = "showDirectoryPicker" in window;
const idb = () => new Promise((res, rej) => {
  const r = indexedDB.open("crm-sync", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("handles");
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const idbSet = async (k, v) => { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction("handles", "readwrite"); tx.objectStore("handles").put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); };
const idbGet = async k => { const db = await idb(); return new Promise((res, rej) => { const rq = db.transaction("handles").objectStore("handles").get(k); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); };
const idbDel = async k => { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction("handles", "readwrite"); tx.objectStore("handles").delete(k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); };
async function ensurePermission(handle, mode = "read") {
  if (await handle.queryPermission({ mode }) === "granted") return true;
  return (await handle.requestPermission({ mode })) === "granted";

}

/* ------------------------------ bulk actions ------------------------------ */
const BULK_TITLE = { csm: "Reassign CSM", tier: "Change tier", task: "Add task to each", churn: "Churn accounts", delete: "Delete accounts" };
const FOCUSABLE = "a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex='-1'])";

// The modal shell, extracted from BulkDialog so ConfirmDialog cannot drift from it.
// Both the focus-on-open behavior and the capture-phase Escape handling below fix real
// bugs; a second hand-written copy is how one of them silently regresses.
function Modal({ label, onClose, initialFocusRef, children, ...rest }) {
  const dlgRef = useRef(null);
  // Focus the first control from the container rather than a ref on each input: <Select>
  // is a plain function component and does not forward refs, so per-input refs silently
  // did nothing for three of the five bulk kinds.
  useEffect(() => {
    const first = dlgRef.current?.querySelector(FOCUSABLE);
    (initialFocusRef?.current || first)?.focus();
  }, [initialFocusRef]);
  useEffect(() => {
    const h = e => {
      // stopPropagation is required: App registers a window-level Escape that closes the
      // account detail view, so an unguarded Escape would close the dialog AND navigate.
      if (e.key === "Escape") { e.stopPropagation(); onClose(); return; }
      if (e.key !== "Tab") return;
      // trap Tab inside the modal: without this it walks into the table behind the
      // overlay, which is inert to the eye but not to the keyboard
      const items = [...(dlgRef.current?.querySelectorAll(FOCUSABLE) || [])];
      if (items.length === 0) return;
      const first = items[0], last = items[items.length - 1];
      const active = document.activeElement;
      if (!dlgRef.current.contains(active)) { e.preventDefault(); first.focus(); return; }
      if (e.shiftKey && active === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }
    };
    window.addEventListener("keydown", h, true); // capture phase: runs before App's handler
    return () => window.removeEventListener("keydown", h, true);
  }, [onClose]);
  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center bg-slate-900/40 pt-[15vh]" onClick={onClose}>
      <div ref={dlgRef} role="dialog" aria-modal="true" aria-label={label}
           className="nm w-full max-w-md p-4" onClick={e => e.stopPropagation()} {...rest}>
        {children}
      </div>
    </div>
  );
}

// Guards actions in proportion to how reversible they are. Reversible actions do not use
// this at all -- they act immediately and offer an Undo toast, which is safer than a
// dialog people click through reflexively.
function ConfirmDialog({ title, body, confirmLabel = "Confirm", tone = "danger", typedWord, onConfirm, onClose }) {
  const [typed, setTyped] = useState("");
  const [busy, setBusy] = useState(false);
  const inputRef = useRef();
  const ready = !typedWord || typed === typedWord;
  const go = async () => {
    if (!ready || busy) return;
    setBusy(true);
    try { await onConfirm(); } finally { onClose(); }
  };
  return (
    <Modal label={title} onClose={onClose} initialFocusRef={typedWord ? inputRef : undefined} data-confirmdialog>
      <h3 className="mb-2 text-sm font-bold text-slate-800">{title}</h3>
      <p className={`text-xs ${tone === "danger" ? "text-rose-700" : "text-slate-600"}`}>{body}</p>
      {typedWord && <label className="mt-3 block text-xs text-slate-700">Type {typedWord} to confirm
        <Input ref={inputRef} value={typed} onChange={e => setTyped(e.target.value)} /></label>}
      <div className="mt-4 flex gap-2">
        <Btn kind="primary" disabled={!ready || busy} data-confirm-go onClick={go}>{confirmLabel}</Btn>
        <Btn onClick={onClose}>Cancel</Btn>
      </div>
    </Modal>
  );
}
function BulkDialog({ kind, ids, accounts, team, user, dispatch, onClose }) {

    : kind === "delete" ? confirmText === "DELETE"

    // (realtime refetch may have dropped a row out from under it) -- never act on ids

        undo: () => dispatch({ type: "BULK_DELETE_TASKS", ids: [...created] }) });
    } else {
      const snapshot = snapshotFor(state, liveIds);
      // built here (not in the reducer) so the undo callback can name the exact rows to
      // delete: RESTORE_SNAPSHOT merges rather than replaces, so it restores the account
      // to Active but leaves any activity added after the snapshot in place.

        const a = state.accounts.find(x => x.id === id);

      else if (kind === "tier") dispatch({ type: "BULK_PATCH_ACCOUNTS", ids: liveIds, patch: { tier: tierVal }, by: user.name });
      else if (kind === "churn") dispatch({ type: "BULK_CHURN", ids: liveIds, reason, note, date, by: user.name, activities: churnActs });
      else if (kind === "delete") dispatch({ type: "BULK_DELETE", ids: liveIds });

      toast({ text: `${verb} ${n} account${n === 1 ? "" : "s"}.`, tone: "success",
        undo: () => {
          dispatch({ type: "RESTORE_SNAPSHOT", snapshot });

        <div className="mb-3 flex items-center">
          <h3 className="flex-1 text-sm font-bold text-slate-800">{BULK_TITLE[kind]} · {ids.length} account{ids.length === 1 ? "" : "s"}</h3>
          <button aria-label="Close dialog" className="text-slate-400 hover:text-slate-700" onClick={onClose}>✕</button>
        </div>

            <Select value={csmVal} onChange={e => setCsmVal(e.target.value)} options={names.length ? names : [user.name]} /></label>}
          {kind === "tier" && <label className="text-xs text-slate-700">New tier
            <Select value={tierVal} onChange={e => setTierVal(e.target.value)} options={["Enterprise", "Mid", "SMB"]} /></label>}
          {kind === "task" && <>
            <label className="text-xs text-slate-700">Title<Input ref={ref} value={title} onChange={e => setTitle(e.target.value)} /></label>
            <label className="text-xs text-slate-700">Due<Input type="date" value={due} onChange={e => setDue(e.target.value)} /></label>
            <label className="text-xs text-slate-700">Owner
              <Select value={owner} onChange={e => setOwner(e.target.value)} options={names.length ? names : [user.name]} /></label>
          </>}
          {kind === "churn" && <>
            <label className="text-xs text-slate-700">Reason (required)
              <Select value={reason} onChange={e => setReason(e.target.value)} options={["", ...CHURN_REASONS]} /></label>
            <label className="text-xs text-slate-700">Date<Input type="date" value={date} onChange={e => setDate(e.target.value)} /></label>
            <label className="text-xs text-slate-700">Note<Input value={note} onChange={e => setNote(e.target.value)} /></label>
            <p className="text-[11px] text-slate-500">One shared reason is written to all {ids.length} accounts.</p>
          </>}
          {kind === "delete" && <>
            <p className="text-xs text-rose-700">This deletes {ids.length} account{ids.length === 1 ? "" : "s"} and all their contacts, activities, tasks and opportunities. Sub-accounts survive but lose their parent.</p>
            <label className="text-xs text-slate-700">Type DELETE to confirm
              <Input ref={ref} value={confirmText} onChange={e => setConfirmText(e.target.value)} /></label>
          </>}
        </div>
        <div className="mt-4 flex gap-2">
          <Btn kind="primary" disabled={!ready} data-bulk-confirm onClick={submit}>Apply</Btn>
          <Btn onClick={onClose}>Cancel</Btn>
        </div>
    </Modal>
  );
}

function AccountList({ scored, allAccounts, openAccount, searchRef, dispatch, team, initialFilter, user, settings }) {
  const [adding, setAdding] = useState(false);
  const [showChurned, setShowChurned] = useState(false);
  const churnedCount = scored.filter(a => a.churn).length;
  const [q, setQ] = useState(""); const [tier, setTier] = useState("All"); const [risk, setRisk] = useState("All");
  const [csm, setCsm] = useState("All"); const [renew, setRenew] = useState("All");
  const [billing, setBilling] = useState("All");
  const [onlyChurned, setOnlyChurned] = useState(false);
  const [qbrDue, setQbrDue] = useState(false);
  const [selected, setSelected] = useState(() => new Set());
  const toggleOne = id => setSelected(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const [bulkAction, setBulkAction] = useState(null); // "csm" | "tier" | "task" | "churn" | "delete"
  const [sort, setSort] = useState({ k: "accountNo", dir: 1 });
  const [activeSeg, setActiveSeg] = useState("");
  const [pendingSeg, setPendingSeg] = useState(null);
  const segments = (settings && settings.segments) || [];
  // Applies ONLY the keys the caller actually supplied. Dashboard cards pass a partial
  // filter and must leave everything else -- notably the user's typed `q` -- untouched;
  // a saved segment carries all ten keys, so applying one sets every field. Same code
  // path, different payloads. Do NOT turn this into a full reset.
  const applyFilter = useCallback(f => {
    const has = k => Object.prototype.hasOwnProperty.call(f, k);
    if (has("q")) setQ(f.q);
    if (has("tier")) setTier(f.tier);
    if (has("risk")) setRisk(f.risk);
    if (has("csm")) setCsm(f.csm);
    if (has("renew")) setRenew(f.renew);
    if (has("billing")) setBilling(f.billing);
    if (has("showChurned")) setShowChurned(!!f.showChurned);
    if (has("onlyChurned")) setOnlyChurned(!!f.onlyChurned);
    if (has("qbrDue")) setQbrDue(!!f.qbrDue);
    if (has("sort")) setSort(f.sort);
  }, []);
  useEffect(() => { if (initialFilter) applyFilter(initialFilter); }, [initialFilter, applyFilter]);
  useEffect(() => { if (pendingSeg) applyFilter(pendingSeg); }, [pendingSeg, applyFilter]);
  const fileRef = useRef(null);
  const [importMsg, setImportMsg] = useState(null);
  const csms = ["All", ...new Set(scored.map(a => a.csm))];
  const rows = useMemo(() => {
    let r = scored.filter(a => (showChurned || !a.churn) && (!onlyChurned || a.churn) &&
      (!q || (a.name + a.industry).toLowerCase().includes(q.toLowerCase())) &&
      (tier === "All" || a.tier === tier) && (risk === "All" || a.risk === risk) && (csm === "All" || a.csm === csm) &&
      (billing === "All" || (billing === "Completed") === !!a.billingCompleted) &&
      (!qbrDue || ["due", "overdue"].includes(qbrStatus(a)?.kind || "")) &&
      (renew === "All" || (daysUntil(a.renewalDate) >= 0 && daysUntil(a.renewalDate) <= +renew)));
    const get = a => sort.k === "renewalDate" ? daysUntil(a.renewalDate) : sort.k === "arr" ? a.arrUSD : a[sort.k];
    const sorted = [...r].sort((a, b) => (get(a) > get(b) ? 1 : get(a) < get(b) ? -1 : 0) * sort.dir);
    // group: each top-level row followed by its (filter-surviving) subs; subs whose
    // parent is filtered out appear at their own sorted position
    const byParent = new Map();
    sorted.forEach(a => { if (a.parentId) byParent.set(a.parentId, [...(byParent.get(a.parentId) || []), a]); });
    const topIds = new Set(sorted.filter(a => !a.parentId).map(a => a.id));
    const out = [];
    sorted.forEach(a => {
      if (a.parentId && topIds.has(a.parentId)) return; // rendered under its parent
      out.push(a);
      (byParent.get(a.id) || []).forEach(s => out.push({ ...s, _sub: true }));
    });
    return out;
  }, [scored, q, tier, risk, csm, renew, billing, sort, showChurned, onlyChurned, qbrDue]);
  // a selection must never outlive the rows that produced it
  useEffect(() => { setSelected(new Set()); }, [q, tier, risk, csm, renew, billing, showChurned, onlyChurned, qbrDue]);
  // teammates' edits arrive via a ~800ms realtime refetch and can change the visible
  // row set underneath a selection -- prune ids that no longer exist, but never wipe
  // the rest of an in-progress selection just because something elsewhere changed.
  useEffect(() => {
    const live = new Set(scored.map(a => a.id));
    setSelected(s => {
      const n = new Set([...s].filter(id => live.has(id)));
      return n.size === s.size ? s : n;
    });
  }, [scored]);
  const allVisibleSelected = rows.length > 0 && rows.every(a => selected.has(a.id));
  const toggleAll = () => setSelected(allVisibleSelected ? new Set() : new Set(rows.map(a => a.id)));
  // rollup: sum of non-churned sub ARR (USD) per parent, over the whole book
  const subArr = useMemo(() => {
    const m = new Map();
    scored.forEach(a => { if (a.parentId && !a.churn) m.set(a.parentId, (m.get(a.parentId) || 0) + a.arrUSD); });

        onClick={() => setSort(s => ({ k, dir: s.k === k ? -s.dir : 1 }))}>

    </th>
  );
  return (
    <Card title={`Accounts (${rows.length})`} right={<div className="flex gap-2">
      <Btn kind="primary" onClick={() => setAdding(a => !a)}>+ New account</Btn>

      <Btn onClick={() => exportCSV(rows)}>Export CSV</Btn>
      <input ref={fileRef} type="file" accept=".csv,text/csv" className="hidden"
        onChange={e => { const f = e.target.files[0]; e.target.value = ""; if (f) importAccountsCSV(f, allAccounts, dispatch, setImportMsg, user); }} />
    </div>}>
      {/* The filtered count lives in the Card's title prop, so there is no element there to
          annotate. A visually-hidden live region announces it instead. */}
      <span data-live="results" aria-live="polite" className="sr-only">{rows.length} accounts</span>
      {/* A live region must already be in the DOM when its content changes, or the change is
          frequently not announced. This sr-only region is permanent and mirrors a short form
          of the result; the visual banner below is left structurally untouched, because
          csv.test.mjs locates it as "the first div whose text starts with Imported". */}
      <span data-live="import" aria-live="polite" className="sr-only">
        {importMsg ? (importMsg.err || `Imported ${importMsg.ok} new, updated ${importMsg.updated} existing`) : ""}
      </span>
      {importMsg && <div className={`nm-sm mb-3 flex items-center gap-2 p-3 text-sm ${importMsg.err ? "text-rose-600" : (importMsg.badTier || importMsg.badStatus) ? "text-amber-700" : "text-emerald-700"}`}>
        {importMsg.err ? importMsg.err : <>Imported {importMsg.ok} new · updated {importMsg.updated} existing (matched by account # or name){importMsg.skipped ? ` · skipped ${importMsg.skipped} row(s) without a name` : ""}. Columns: accountNo, name (required), tier, arr, currency, industry, csm, startDate, renewalDate, contractStatus, modules, licenses, dedicatedSupport, billingCompleted, billingCompletedDate, usage, sentiment, tickets, nps.
          {/* coercions last and bold: buried mid-sentence ahead of the column list, a silently
              rewritten row looked identical to a clean import */}
          {(importMsg.badTier || importMsg.badStatus) && <span className="font-bold">
            {importMsg.badTier ? ` ⚠ ${importMsg.badTier} row(s) had an unrecognized tier (set to Mid).` : ""}
            {importMsg.badStatus ? ` ⚠ ${importMsg.badStatus} row(s) had an unrecognized status (set to Active).` : ""}
          </span>}</>}
        <button className="ml-auto text-xs font-semibold text-slate-500 hover:text-slate-800" onClick={() => setImportMsg(null)}>✕</button>
      </div>}
      {adding && <div className="nm-inset mb-4 p-4"><AccountForm dispatch={dispatch} onDone={() => setAdding(false)} team={team} accounts={allAccounts} user={user} /></div>}
      <div className="mb-3 flex flex-wrap items-center gap-2">
        <Select data-segment-select value={activeSeg} className="w-40" aria-label="Saved segment"
          onChange={e => {
            const id = e.target.value; setActiveSeg(id);
            const s = segments.find(x => x.id === id);
            // stamp with `t` so re-picking the same segment is still a new object and
            // the effect re-applies it after the user has hand-edited the filters
            if (s) setPendingSeg({ ...s.filter, t: Date.now() });
          }}
          options={["", ...segments.map(s => s.id)]}
          labels={{ "": "— segment —", ...Object.fromEntries(segments.map(s => [s.id, s.name])) }} />
        {/* Segments live in the `settings` row, whose RLS policy is admin-only
            (settings_write ... using (is_admin())). Showing these to a CSM would give
            them an optimistic segment, a rejected write and a "Save failed (settings)"
            toast, with nothing left after a reload. Everyone can still APPLY a segment
            an admin saved -- reads are open to all authenticated users. */}
        {user.role === "admin" && <Btn data-save-segment onClick={() => {
          const name = window.prompt("Name this segment");
          if (!name) return;
          const seg = { id: uid(), name, filter: { q, tier, risk, csm, renew, billing, showChurned, onlyChurned, qbrDue, sort } };
          dispatch({ type: "SET_SEGMENTS", segments: [...segments, seg] });
        }}>Save view</Btn>}
        {user.role === "admin" && activeSeg && <Btn data-delete-segment onClick={() => {
          dispatch({ type: "SET_SEGMENTS", segments: segments.filter(s => s.id !== activeSeg) });
          setActiveSeg("");
        }}>Delete segment</Btn>}
        <Input placeholder="Search  ( / )" value={q} onChange={e => setQ(e.target.value)} className="w-48" ref={searchRef} />
        <Select aria-label="Filter by tier" value={tier} onChange={e => setTier(e.target.value)} options={["All", "Enterprise", "Mid", "SMB"]} />
        <Select aria-label="Filter by health risk" value={risk} onChange={e => setRisk(e.target.value)} options={["All", "Green", "Yellow", "Red"]} />
        <Select aria-label="Filter by CSM" value={csm} onChange={e => setCsm(e.target.value)} options={csms} />
        <Select aria-label="Filter by renewal window in days" value={renew} onChange={e => setRenew(e.target.value)} options={["All", "30", "60", "90"]} />
        <span className="text-xs text-slate-500">renew ≤ days</span>
        <Select aria-label="Filter by billing status" value={billing} onChange={e => setBilling(e.target.value)} options={["All", "Completed", "Pending"]} />
        <span className="text-xs text-slate-500">billing</span>
        {churnedCount > 0 && <label className="ml-2 flex items-center gap-1.5 text-xs text-slate-600">
          <input type="checkbox" checked={showChurned} onChange={e => { setShowChurned(e.target.checked); if (!e.target.checked) setOnlyChurned(false); }} />show churned ({churnedCount})</label>}
        {onlyChurned && <button className="rounded-full bg-rose-100 px-2 py-0.5 text-xs font-bold text-rose-600" onClick={() => setOnlyChurned(false)} title="Remove churned-only filter">churned only ✕</button>}
        {qbrDue && <button className="rounded-full bg-amber-100 px-2 py-0.5 text-xs font-bold text-amber-700" onClick={() => setQbrDue(false)} title="Remove QBR-due filter">QBR due ✕</button>}
      </div>
      {selected.size > 0 && (

      <div className="max-h-[65vh] overflow-auto">
        <table className="w-full text-sm">
          <thead className="sticky top-0 z-10 bg-white"><tr className="border-b border-slate-200">
            <th className="w-8 px-2 py-1.5">

            <Th k="csm">CSM</Th><Th k="score">Health</Th><Th k="renewalDate">Renewal</Th>{qbrDue && <Th k="nextQbrDate">Next QBR</Th>}<Th k="billingCompletedDate">Billing</Th><th className="px-2 text-left text-[11px] font-bold uppercase tracking-widest text-slate-500">Flags</th>
          </tr></thead>
          <tbody>
            {rows.length === 0 && <tr><td colSpan={qbrDue ? 12 : 11} className="px-2 py-8 text-center text-sm text-slate-500">
              {scored.length === 0 ? <>No accounts yet — click <b>+ New account</b> to add your first, or load sample data from Settings.</> : "No accounts match the current filters."}
            </td></tr>}
            {rows.map(a => {
              const d = daysUntil(a.renewalDate);
              return (
                <tr key={a.id} className={`cursor-pointer border-b border-slate-100 hover:bg-slate-50 ${a.churn ? "opacity-50" : ""}`} onClick={() => openAccount(a.id)}>
                  <td className="px-2 py-1.5" onClick={e => e.stopPropagation()}>
