                  <td className="px-2 py-1.5 font-medium">{a._sub && <span className="mr-1 text-slate-400">↳</span>}{a.name}{a.churn && <span className="ml-2 rounded-full bg-rose-100 px-2 py-0.5 text-[11px] font-bold text-rose-600">churned</span>}</td>
                  <td className="px-2">{a.tier}</td>
                  <td className="px-2">{fmtMoney(a.arr, a.currency)}{a.currency !== "USD" && <span className="ml-1 text-xs text-slate-500">≈{fmtMoney(a.arrUSD)}</span>}
                    {subArr.has(a.id) && <span className="ml-1 text-xs font-semibold text-indigo-600" title="Own + sub-accounts (USD)">Σ {fmtMoney(a.arrUSD + subArr.get(a.id))}</span>}</td>
                  <td className="px-2 text-slate-700">{a.industry}</td>
                  <td className="px-2">{a.csm}</td>
                  <td className="px-2"><HealthChip score={a.score} /></td>
                  <td className="px-2"><span className={d < 60 ? "font-semibold text-amber-600" : "text-slate-700"}>{fmtDate(a.renewalDate)} · {d}d</span></td>
                  {qbrDue && <td className="px-2">{(() => { const qd = a.nextQbrDate ? daysUntil(a.nextQbrDate) : null;
                    return qd === null ? <span className="text-xs text-slate-500">—</span>
                      : <span className={`text-xs font-semibold ${qd < 0 ? "text-rose-600" : "text-amber-600"}`}>{fmtDate(a.nextQbrDate)} · {qd < 0 ? `${-qd}d overdue` : `in ${qd}d`}</span>; })()}</td>}
                  <td className="px-2 text-xs">{a.billingCompleted ? <span className="text-emerald-600">✓ {fmtDate(a.billingCompletedDate)}</span> : <span className="text-amber-600">pending</span>}</td>
                  <td className="px-2">{a.flags.map(f => <span key={f} className="mr-1 rounded bg-rose-50 border border-rose-200 px-1 py-0.5 text-[11px] text-rose-600">{f}</span>)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </Card>
  );
}

  return (

        <Meta label="Industry" value={a.industry} />
        <Meta label="ARR" value={`${fmtMoney(a.arr, a.currency)}${a.currency !== "USD" ? ` (≈${fmtMoney(a.arrUSD)} USD)` : ""}`} />
        <Meta label="CSM" value={a.csm} />
        {a.licenses ? <Meta label="Licenses" value={a.licenses} /> : null}
        {a.dedicatedSupport ? <Meta label="Support" value="Dedicated" /> : null}
        {a.modules ? <Meta label="Modules" value={a.modules} /> : null}

      </div>
      {/* Status row: renewal / stage / billing / QBR badges */}
      <div className="flex flex-wrap items-center gap-2">
        <span className={`nm-sm !rounded-full px-3 py-1 text-sm font-semibold ${d < 60 ? "text-amber-600" : "text-slate-700"}`}>Renewal {fmtDate(a.renewalDate)} · {d}d · {a.contractStatus}</span>
        {!a.churn && <select value={renewalStageOf(a)} title="Renewal stage"
          onChange={e => dispatch({ type: "EDIT_ACCOUNT", id: a.id, patch: { renewalStage: e.target.value }, by: user?.name, source: "inline" })}
          className={`cursor-pointer rounded-full border-0 px-3 py-1 text-xs font-bold outline-none ${RENEWAL_STAGE_STYLE[renewalStageOf(a)]}`}>
          {RENEWAL_STAGES.map(s => <option key={s} value={s}>{s}</option>)}
        </select>}
        <span className={`nm-sm !rounded-full px-3 py-1 text-sm font-semibold ${a.billingCompleted ? "text-emerald-600" : "text-amber-600"}`}>
          {a.billingCompleted ? `Billing ✓ ${fmtDate(a.billingCompletedDate)}` : "Billing pending"}</span>
        {(() => { const s = qbrStatus(a); return s && (
          <span className={`nm-sm !rounded-full px-3 py-1 text-sm font-semibold ${s.kind === "overdue" ? "text-rose-600" : s.kind === "due" ? "text-amber-600" : "text-slate-700"}`}>
            {s.kind === "overdue" ? `QBR overdue ${s.d}d` : s.kind === "due" ? `QBR due in ${s.d}d` : s.kind === "scheduled" ? `Next QBR ${fmtDate(a.nextQbrDate)}` : "QBR not scheduled"}
          </span>); })()}
      </div>
      <div className="flex flex-wrap gap-2">
        <Btn kind="primary" onClick={() => setForm("activity")}>+ Log activity</Btn>
        <Btn kind="primary" onClick={() => setForm("task")}>+ Add task</Btn>
        <Btn kind="primary" onClick={() => setForm("health")}>✎ Update health</Btn>
        {!a.churn && <Btn kind="primary" onClick={() => setForm("renewal")}>✓ Complete renewal</Btn>}
        {!a.churn && !a.billingCompleted && <Btn kind="primary" onClick={() => setForm("billing")}>$ Mark billing completed</Btn>}
        <Btn onClick={() => setForm("edit")}>✎ Edit account</Btn>
        <Btn onClick={() => setForm("contact")}>+ Contact</Btn>
        <Btn onClick={() => setForm("opp")}>+ Opportunity</Btn>
        {!a.churn && <Btn onClick={() => setForm("adjust")}>⇄ Adjust ARR</Btn>}
        {!a.churn && <button className="nm-btn px-3 py-1.5 text-xs font-bold text-rose-500" onClick={() => setForm("churn")}>✖ Mark churned</button>}
        {a.churn && <button className="nm-btn px-3 py-1.5 text-xs font-bold text-emerald-600"
          onClick={() => {
            // Reversible in one dispatch, so no dialog: act, then offer Undo.
            const prev = a.churn;
            dispatch({ type: "REACTIVATE_ACCOUNT", id: a.id, by: user.name });
            dispatch({ type: "ADD_ACTIVITY", item: { id: uid(), accountId: a.id, type: "note", date: iso(Date.now()), summary: `Account reactivated by ${user.name}` } });
            toast({ text: `Reactivated ${a.name}.`, tone: "success",
              undo: () => dispatch({ type: "CHURN_ACCOUNT", id: a.id, entry: prev }) });
          }}>↻ Reactivate</button>}
        {a.flags.map(f => <span key={f} className="rounded bg-rose-50 border border-rose-200 px-2 py-1 text-xs text-rose-600">{f}</span>)}
        {user.role === "admin" && <button className="nm-btn ml-auto px-3 py-1.5 text-xs font-bold text-rose-500"
          onClick={() => {
            // No dialog: the Undo toast below is the guard, and it is a better one --
            // a confirm people click through protects nothing.
            // snapshot BEFORE the dispatch -- snapshotFor reads the pre-delete state and
            // already handles a single id, including sub-account parentIds
            const snapshot = snapshotFor(st, [a.id]);
            dispatch({ type: "DELETE_ACCOUNT", id: a.id });
            toast({ text: `Deleted ${a.name}.`, tone: "success",
              undo: () => dispatch({ type: "RESTORE_SNAPSHOT", snapshot }) });
            back();
          }}>Delete account</button>}
      </div>
      {a.churn && <div className="nm-sm flex flex-wrap items-center gap-3 p-3 text-sm">
        <span className="rounded-full bg-rose-500 px-3 py-1 text-xs font-bold text-white">CHURNED</span>
        <span className="text-slate-700">{fmtDate(a.churn.date)} · {a.churn.reason}{a.churn.note ? ` — ${a.churn.note}` : ""}</span>
        <span className="ml-auto text-xs text-slate-500">{fmtMoney(a.churn.arr, a.churn.currency)} ARR lost · recorded by {a.churn.by}</span>
      </div>}
      {subs.length > 0 && <Card title={`Sub-accounts (${subs.length}) · rollup ${fmtMoney(toUSD(a.arr, a.currency, st.settings.rates) + subs.filter(s => !s.churn).reduce((t, s) => t + s.arrUSD, 0))} USD`}>
        {subs.map(s => (
          <button key={s.id} onClick={() => openAccount(s.id)} className="flex w-full items-center justify-between rounded px-2 py-1.5 text-left text-sm hover:bg-slate-50">
            <span>{s.name}{s.churn && <span className="ml-2 rounded-full bg-rose-100 px-2 py-0.5 text-[11px] font-bold text-rose-600">churned</span>}</span>
            <span className="flex items-center gap-2 text-xs text-slate-700">{fmtMoney(s.arr, s.currency)} <HealthChip score={s.score} /></span>
          </button>
        ))}
      </Card>}
      {form && <Card>{form === "activity" ? <LogActivityForm acct={a} dispatch={dispatch} onDone={() => setForm(null)} />
        : form === "task" ? <AddTaskForm acct={a} dispatch={dispatch} onDone={() => setForm(null)} team={team} user={user} />
        : form === "contact" ? <AddContactForm acct={a} dispatch={dispatch} onDone={() => setForm(null)} />
        : form === "opp" ? <AddOppForm acct={a} dispatch={dispatch} onDone={() => setForm(null)} />
        : form === "edit" ? <AccountForm existing={a} dispatch={dispatch} onDone={() => setForm(null)} team={team} accounts={st.accounts} user={user} />
        : form === "renewal" ? <CompleteRenewalForm acct={a} user={user} dispatch={dispatch} onDone={() => setForm(null)} />
        : form === "billing" ? <BillingForm acct={a} user={user} dispatch={dispatch} onDone={() => setForm(null)} />
        : form === "churn" ? <ChurnForm acct={a} user={user} dispatch={dispatch} onDone={() => setForm(null)} />
        : form === "adjust" ? <AdjustArrForm acct={a} user={user} dispatch={dispatch} onDone={() => setForm(null)} />
        : form && form.t === "editActivity" ? <LogActivityForm acct={a} existing={form.item} dispatch={dispatch} onDone={() => setForm(null)} />
        : form && form.t === "editTask" ? <AddTaskForm acct={a} existing={form.item} team={team} user={user} dispatch={dispatch} onDone={() => setForm(null)} />
        : <UpdateHealthForm acct={a} dispatch={dispatch} onDone={() => setForm(null)} />}</Card>}
      <div className="grid gap-4 lg:grid-cols-3">
        <Card title="Health trend">
          {(() => { const iu = daysSince(a.inputsUpdatedAt || a.startDate); return (
            <div className={`mb-2 text-xs font-bold ${iu >= 45 ? "text-rose-500" : iu >= 30 ? "text-amber-600" : "text-slate-500"}`}>
              Inputs last updated {iu === 0 ? "today" : iu + "d ago"}{iu >= 30 ? " — refresh via ✎ Update health" : ""}
            </div>); })()}
          <Sparkline points={[...(a.history || []), { d: iso(Date.now()), s: a.score }]} />
          <div className="mt-2 space-y-0.5 text-xs text-slate-700">
            {Object.keys(comps).map(k => <div key={k} className="flex justify-between"><span>{WEIGHT_LABELS[k]}</span><span className="font-mono">{comps[k]}</span></div>)}
          </div>
        </Card>
        <Card title={`Open tasks (${tasks.length})`}>
          {tasks.length === 0 && <div className="text-sm text-slate-500">None open.</div>}
          {tasks.map(t => (
            <div key={t.id} className="border-b border-slate-100 py-1.5 last:border-0">
              <div className="flex items-center gap-2 text-sm">
                <input type="checkbox" checked={false} onChange={() => dispatch({ type: "TOGGLE_TASK", id: t.id })} />
                <span className="flex-1">{t.title}</span>
                <span className="text-xs text-slate-500">{t.owner}</span>
                <span className={`text-xs ${daysUntil(t.due) < 0 ? "text-rose-600 font-semibold" : "text-slate-700"}`}>{fmtDate(t.due)}</span>
                <span className="text-xs text-slate-500">{t.priority}</span>
                <button title="Edit task" className="text-xs text-indigo-500 hover:text-indigo-700" onClick={() => setForm({ t: "editTask", item: t })}>✎</button>
              </div>
              {t.details && <div className="ml-6 mt-1 whitespace-pre-wrap text-xs text-slate-600">{t.details}</div>}
              {t.attachments && t.attachments.length > 0 && <div className="ml-6 mt-1"><AttachmentLinks items={t.attachments} /></div>}
            </div>
          ))}
        </Card>
        <Card title={`Contacts (${contacts.length})`}>
          {contacts.map(c => (
            <div key={c.id} className="border-b border-slate-100 py-1.5 text-sm last:border-0">
              <div className="flex items-center gap-1 font-medium">{c.isChampion && <span title="Champion">⭐</span>}{c.name}
                <span className={`ml-auto text-xs ${c.sentiment === "Positive" ? "text-emerald-600" : c.sentiment === "Negative" ? "text-rose-600" : "text-slate-500"}`}>{c.sentiment}</span></div>
              <div className="text-xs text-slate-700">{c.role} · {c.email}</div>
            </div>
          ))}
        </Card>
      </div>
      <div className="grid gap-4 lg:grid-cols-2">
        <Card title={`Activity timeline (${acts.length})`}>
          {acts.length === 0 && <div className="text-sm text-slate-500">No activity yet.</div>}
          {acts.map(x => (
            <div key={x.id} className="border-b border-slate-100 py-1.5 last:border-0">
              <div className="flex items-center gap-3 text-sm">
                <span className="nm-inset w-16 shrink-0 px-1.5 py-0.5 text-center text-xs font-bold text-slate-700">{x.type}</span>
                <span className="flex-1">{x.summary}</span>
                <span className="shrink-0 text-xs text-slate-500">{fmtDate(x.date)}</span>
                <button title="Edit activity" className="shrink-0 text-xs text-indigo-500 hover:text-indigo-700" onClick={() => setForm({ t: "editActivity", item: x })}>✎</button>
              </div>
              {x.details && <div className="ml-[76px] mt-1 whitespace-pre-wrap text-xs text-slate-600">{x.details}</div>}
              {x.attachments && x.attachments.length > 0 && <div className="ml-[76px] mt-1"><AttachmentLinks items={x.attachments} /></div>}
            </div>
          ))}
        </Card>
        <Card title={`Opportunities (${opps.filter(o => !["Won", "Lost"].includes(o.stage)).length} open)`}>
          {opps.length === 0 && <div className="text-sm text-slate-500">None.</div>}
          {opps.map(o => (
            <div key={o.id} className={`flex items-center gap-3 border-b border-slate-100 py-1.5 text-sm last:border-0 ${["Won", "Lost"].includes(o.stage) ? "opacity-60" : ""}`}>
              <span className="rounded bg-indigo-50 px-1.5 py-0.5 text-xs font-semibold text-indigo-600">{o.type}</span>
              <span className="flex-1 font-medium">{fmtMoney(o.value, a.currency)}</span>
              <Select value={o.stage} options={["Discovery", "Proposal", "Negotiation", "Stalled", "Won", "Lost"]}
                disabled={!!a.churn} title={a.churn ? "Account is churned — reactivate it to work opportunities" : undefined}
                className="!px-2 !py-0.5 text-xs disabled:opacity-50" onChange={e => {
                  const stage = e.target.value;
                  if (stage === o.stage) return;
                  if (stage === "Won") {
                    // The select is controlled by o.stage, so opening the dialog re-renders
                    // it back to the current stage until the change is actually confirmed.
                    setConfirmOpp({ kind: "won", opp: o, run: () => {
                      dispatch({ type: "SET_OPP_STAGE", id: o.id, stage });
                      dispatch({ type: "ADJUST_ARR", id: a.id, newArr: a.arr + o.value,
                        entry: { id: uid(), date: iso(Date.now()), delta: o.value, kind: "expansion", source: "opportunity", reason: `${o.type} won`, note: "", by: user.name } });
                      dispatch({ type: "ADD_ACTIVITY", item: { id: uid(), accountId: a.id, type: "note", date: iso(Date.now()),
                        summary: `Opportunity WON — ${fmtMoney(o.value, a.currency)} ${o.type} · ARR now ${fmtMoney(a.arr + o.value, a.currency)} · by ${user.name}` } });
                    } });
                  } else if (o.stage === "Won") {
                    setConfirmOpp({ kind: "stage", opp: o, run: () => dispatch({ type: "SET_OPP_STAGE", id: o.id, stage }) });
                  } else {
                    dispatch({ type: "SET_OPP_STAGE", id: o.id, stage });
                  }
                }} />
              <span className="text-xs text-slate-500">close {fmtDate(o.closeDate)}</span>
            </div>
          ))}
        </Card>
      </div>
      {confirmOpp && <ConfirmDialog
        title={confirmOpp.kind === "won" ? "Book expansion ARR" : "Change a booked opportunity"}
        tone={confirmOpp.kind === "won" ? "normal" : "danger"}
        body={confirmOpp.kind === "won"
          ? `Mark this ${confirmOpp.opp.type} as WON and book ${fmtMoney(confirmOpp.opp.value, a.currency)} expansion ARR onto ${a.name}?`
          : "This opportunity was already booked as Won expansion. Changing its stage does NOT reverse the ARR — use ⇄ Adjust ARR for that."}
        confirmLabel={confirmOpp.kind === "won" ? "Book it" : "Continue"}
        onConfirm={() => confirmOpp.run()}
        onClose={() => setConfirmOpp(null)} />}
      <DocumentsCard a={a} dispatch={dispatch} user={user} />
      {(() => {
        const events = [
          ...(a.renewals || []).map(r => ({ id: r.id, date: r.completedOn, sort: r.completedOn, kind: "renewal", r })),
          ...(a.arrEvents || []).map(ev => ({ id: ev.id, date: ev.date, sort: ev.date, kind: ev.kind, ev })),
          ...(a.churn ? [{ id: "churn", date: a.churn.date, sort: a.churn.date, kind: "churn" }] : []),
        ].sort((x, y) => y.sort.localeCompare(x.sort));
        return (
          <Card title={`Revenue history (${events.length})`}>
            {events.length === 0 && <div className="text-sm text-slate-500">No revenue events yet — renewals, won opportunities, ARR adjustments and churn all land here.</div>}
            {events.map(e => (
              <div key={e.id} className="flex flex-wrap items-center gap-3 border-b border-slate-100 py-1.5 text-sm last:border-0">
                {e.kind === "renewal" && <>
                  <span className="rounded bg-emerald-100 px-1.5 py-0.5 text-xs font-semibold text-emerald-700">✓ renewed</span>
                  <span className="text-slate-800">{fmtDate(e.date)}</span>
                  <span className="flex-1 text-xs text-slate-700">term extended {fmtDate(e.r.from)} → <b>{fmtDate(e.r.to)}</b></span>
                  <span className={`text-xs ${e.r.billingCompleted ? "text-emerald-600" : "text-slate-400"}`}>{e.r.billingCompleted ? `billed ${fmtDate(e.r.billingCompletedDate)}` : "billing n/a"}</span>
                  <span className="text-xs">{fmtMoney(e.r.arr, a.currency)}{e.r.arr !== e.r.prevArr && <span className={e.r.arr > e.r.prevArr ? "ml-1 text-emerald-600" : "ml-1 text-rose-600"}>({e.r.arr > e.r.prevArr ? "▲" : "▼"} from {fmtMoney(e.r.prevArr, a.currency)})</span>}</span>
                  <span className="text-xs text-slate-500">by {e.r.by}</span>
                </>}
                {(e.kind === "expansion" || e.kind === "contraction") && <>
                  <span className={`rounded px-1.5 py-0.5 text-xs font-semibold ${e.kind === "expansion" ? "bg-emerald-100 text-emerald-700" : "bg-rose-100 text-rose-600"}`}>{e.kind === "expansion" ? "▲ expansion" : "▼ reduction"}</span>
                  <span className="text-slate-800">{fmtDate(e.date)}</span>
                  <span className="flex-1 text-xs text-slate-700">{e.ev.reason}{e.ev.note ? ` — ${e.ev.note}` : ""}{e.ev.source === "opportunity" ? " (from opportunity)" : ""}</span>
                  <span className={`text-xs font-bold ${e.ev.delta > 0 ? "text-emerald-600" : "text-rose-600"}`}>{e.ev.delta > 0 ? "+" : "−"}{fmtMoney(Math.abs(e.ev.delta), a.currency)}</span>
                  <span className="text-xs text-slate-500">by {e.ev.by}</span>
                </>}
                {e.kind === "redenomination" && <>
                  <span className="rounded bg-slate-100 px-1.5 py-0.5 text-xs font-semibold text-slate-600">⇄ redenominated</span>
                  <span className="text-slate-800">{fmtDate(e.date)}</span>
                  <span className="flex-1 text-xs text-slate-700">{e.ev.reason} — same revenue, restated</span>
                  <span className="text-xs font-semibold text-slate-600">{fmtMoney(e.ev.fromArr, e.ev.fromCurrency)} → {fmtMoney(e.ev.toArr, e.ev.toCurrency)}</span>
                  <span className="text-xs text-slate-500">by {e.ev.by}</span>
                </>}
                {e.kind === "churn" && <>
                  <span className="rounded bg-rose-500 px-1.5 py-0.5 text-xs font-bold text-white">✖ churned</span>
                  <span className="text-slate-800">{fmtDate(e.date)}</span>
                  <span className="flex-1 text-xs text-slate-700">{a.churn.reason}{a.churn.note ? ` — ${a.churn.note}` : ""}</span>
                  <span className="text-xs font-bold text-rose-600">−{fmtMoney(a.churn.arr, a.churn.currency || a.currency)}</span>
                  <span className="text-xs text-slate-500">by {a.churn.by}</span>
                </>}
              </div>
            ))}
          </Card>
        );
      })()}
      {(a.audit || []).length > 0 && <ChangeHistoryCard a={a} />}
    </div>
  );
}

/* ------------------------------ tasks view ------------------------------ */
const SOURCE_GLYPH = { health: "♥", renewal: "▶", manual: "" };
function TaskRow({ t, a, dispatch, openAccount }) {
  const [custom, setCustom] = useState(false);
  const late = t.status !== "Done" && t.due && daysUntil(t.due) < 0;
  return (
    <div className="flex items-center gap-3 border-b border-slate-100 py-1.5 text-sm last:border-0">
      <input type="checkbox" checked={t.status === "Done"} title="Complete"
        onChange={() => dispatch({ type: "TOGGLE_TASK", id: t.id })} />
      <span className="w-4 text-center text-xs text-slate-400">{SOURCE_GLYPH[taskSource(t)]}</span>
      <span className={`flex-1 ${t.status === "Done" ? "text-slate-400 line-through" : ""}`}>{t.title}</span>
      <button className="text-xs text-indigo-600 hover:underline" onClick={() => openAccount(t.accountId)}>{a ? a.name : "—"}</button>
      <select value="" title="Reschedule" className="nm-inset border-0 px-2 py-1 text-xs text-slate-700 outline-none"
        onChange={e => {
          const v = e.target.value;
          if (v === "custom") { setCustom(true); return; }
          if (v !== "") dispatch({ type: "EDIT_TASK", id: t.id, patch: { due: isoPlus(iso(Date.now()), +v) } });
        }}>
        <option value="">⋯</option>
        <option value="0">Today</option>
        <option value="1">Tomorrow</option>
        <option value="7">+1 week</option>
        <option value="custom">Pick date…</option>
      </select>
      {custom && <input type="date" className="nm-inset border-0 px-2 py-1 text-xs" autoFocus
        onChange={e => { if (e.target.value) { dispatch({ type: "EDIT_TASK", id: t.id, patch: { due: e.target.value } }); setCustom(false); } }}
        onBlur={() => setCustom(false)} />}
      <span className={`w-24 text-right text-xs ${late ? "font-semibold text-rose-600" : "text-slate-700"}`}>{t.due ? fmtDate(t.due) : "—"}</span>
      <span className="w-14 text-right text-xs text-slate-500">{t.priority}</span>
    </div>
  );
}
function TasksView({ st, scored, dispatch, user, openAccount }) {
  const [scope, setScope] = useState("all");
  const [source, setSource] = useState("all");
  const [band, setBand] = useState("all");
  const [q, setQ] = useState("");
  const [open, setOpen] = useState({ overdue: true, today: true, week: false, later: false, done: false });
  const byId = useMemo(() => Object.fromEntries(scored.map(a => [a.id, a])), [scored]);
  const filtered = filterTasks(st.tasks, byId, { scope, userName: user.name, source, band, q });
  const buckets = bucketTasks(filtered, iso(Date.now()));
  const total = Object.values(buckets).reduce((n, list) => n + list.length, 0);
  const SECTIONS = [
    ["overdue", "Overdue"], ["today", "Today"], ["week", "This week"], ["later", "Later"], ["done", "Done"],
  ];
  return (
    <Card title={`Work queue (${total})`} right={
      <div className="flex flex-wrap items-center gap-2">
        <Btn kind={scope === "mine" ? "primary" : "default"} onClick={() => setScope("mine")}>Mine</Btn>
        <Btn kind={scope === "all" ? "primary" : "default"} onClick={() => setScope("all")}>All</Btn>
        {/* plain <select> rather than the shared Select: these need readable labels with
            short values (the values feed filterTasks, so they must stay as-is) */}
        <select value={source} title="Source" onChange={e => setSource(e.target.value)}
          className="nm-inset border-0 px-3 py-1.5 text-sm text-slate-800 outline-none">
          <option value="all">All sources</option>
          <option value="health">♥ Health</option>
          <option value="renewal">▶ Renewal</option>
          <option value="manual">Manual</option>
        </select>
        <select value={band} title="Health band" onChange={e => setBand(e.target.value)}
          className="nm-inset border-0 px-3 py-1.5 text-sm text-slate-800 outline-none">
          <option value="all">All health</option>
          <option value="Red">Red</option>
          <option value="Yellow">Yellow</option>
          <option value="Green">Green</option>
        </select>
        <Input value={q} placeholder="Search tasks…" onChange={e => setQ(e.target.value)} className="w-44" />
      </div>
    }>
      {st.tasks.length === 0 && <p className="text-sm text-slate-500">Nothing in the queue — tasks appear here as playbooks seed them.</p>}
      {st.tasks.length > 0 && total === 0 && <p className="text-sm text-slate-500">No tasks match these filters.</p>}

/* ------------------------------- Renewals ------------------------------- */
const RENEWAL_STAGES = ["Not started", "Outreach", "Quote sent", "Negotiating", "Committed", "At risk"];
const RENEWAL_STAGE_STYLE = {
  "Not started": "bg-slate-100 text-slate-600", Outreach: "bg-sky-100 text-sky-700", "Quote sent": "bg-indigo-100 text-indigo-700",
  Negotiating: "bg-amber-100 text-amber-700", Committed: "bg-emerald-100 text-emerald-700", "At risk": "bg-rose-100 text-rose-700",
};
const renewalStageOf = a => a.renewalStage || "Not started";
function Renewals({ scored, openAccount, dispatch, allBook = [], rates = {}, snapshots = [], tasks = [], user }) {
  const months = [];
  const now = new Date(); now.setDate(1);
  for (let i = 0; i < 12; i++) {
    const m = new Date(now.getFullYear(), now.getMonth() + i, 1);
    const key = `${m.getFullYear()}-${String(m.getMonth() + 1).padStart(2, "0")}`; // local, not toISOString — UTC shifts the month
    months.push({ key, label: m.toLocaleDateString("en-US", { month: "short", year: "numeric" }), items: scored.filter(a => a.renewalDate.slice(0, 7) === key) });
  }
  // 90-day forecast by renewal stage (USD)
  const due90 = scored.filter(a => { const d = daysUntil(a.renewalDate); return d >= 0 && d <= 90; });
  const sum = list => list.reduce((s, a) => s + a.arrUSD, 0);
  const commit = sum(due90.filter(a => renewalStageOf(a) === "Committed"));
  const atRisk = sum(due90.filter(a => renewalStageOf(a) === "At risk"));
  const best = sum(due90) - atRisk;
  const notStarted = due90.filter(a => renewalStageOf(a) === "Not started");
  return (
    <div className="space-y-3">
      <div className="grid grid-cols-4 gap-3">
        <Stat label="Due next 90d" value={fmtMoney(sum(due90))} sub={`${due90.length} renewal(s)`} />
        <Stat label="Commit (90d)" value={fmtMoney(commit)} tone="text-emerald-600" sub="stage: Committed" />
        <Stat label="Best case (90d)" value={fmtMoney(best)} sub="everything except At risk" />
        <Stat label="At risk (90d)" value={fmtMoney(atRisk)} tone={atRisk ? "text-rose-600" : undefined} sub={`${notStarted.length} not started yet`} />
      </div>
      <div className="flex gap-3 overflow-x-auto pb-3">
      {months.map(m => (
        <div key={m.key} className="nm w-56 shrink-0 p-4">
          <div className="mb-2 flex justify-between text-xs font-semibold text-slate-700">
            <span>{m.label}</span><span>{m.items.length ? fmtMoney(m.items.reduce((s, a) => s + a.arrUSD, 0)) + " USD" : ""}</span>
          </div>
          {m.items.length === 0 && <div className="text-xs italic text-slate-400">—</div>}
          {m.items.map(a => (
            <div key={a.id} onClick={() => openAccount(a.id)} className="nm-sm mb-3 w-full cursor-pointer p-2.5 text-left hover:bg-slate-50">
              <div className="flex items-center justify-between text-sm font-medium">{a.name}<HealthChip score={a.score} /></div>
              <div className="mt-0.5 text-xs text-slate-700">{fmtMoney(a.arr, a.currency)} · {a.contractStatus} · {daysUntil(a.renewalDate)}d</div>
              <select value={renewalStageOf(a)} onClick={e => e.stopPropagation()}
                onChange={e => dispatch({ type: "EDIT_ACCOUNT", id: a.id, patch: { renewalStage: e.target.value }, by: user?.name, source: "inline" })}
                className={`mt-1.5 w-full cursor-pointer rounded border-0 px-1.5 py-0.5 text-xs font-semibold outline-none ${RENEWAL_STAGE_STYLE[renewalStageOf(a)]}`}>
                {RENEWAL_STAGES.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
              {(() => {
                const pt = tasks.filter(t => t.accountId === a.id && t.playbook && t.renewalFor === a.renewalDate);
                if (!pt.length) return null;
                const done = pt.filter(t => t.status === "Done").length;
                const behind = pt.some(t => t.status !== "Done" && t.due < iso(Date.now())); // textual ISO compare
                return <span title={behind ? "Playbook behind pace — an open step is past due" : "Playbook on pace"}
                  className={`mt-1.5 inline-block rounded-full px-2 py-0.5 text-[11px] font-bold ${behind ? "bg-amber-100 text-amber-700" : "bg-emerald-100 text-emerald-700"}`}>{done}/{pt.length} ✓</span>;
              })()}
            </div>
          ))}
        </div>
      ))}
      </div>
      <RenewalOutcomes accounts={allBook} rates={rates} snapshots={snapshots} />
    </div>
  );
}

/* One-time backfill: seed ♥ playbooks for accounts that are already at risk.
 * The auto-seeder only fires on band crossings, so accounts that were Red before the
 * feature shipped never get a playbook. Re-seeds already-seeded accounts by design. */
function HealthBackfillCard({ st, dispatch, scored }) {
  const [confirming, setConfirming] = useState(false);
  const [done, setDone] = useState(null);
  const cands = backfillCandidates(scored);
  const fresh = cands.filter(a => a.healthPlaybookBand === undefined).length;
  const seeded = cands.length - fresh;
  const run = () => {
    const today = iso(Date.now());
    const hpb = healthPlaybookOf(st.settings);
    const existingIds = new Set(st.tasks.map(t => t.id));
    let tasks = 0, accounts = 0;
    cands.forEach(a => {
      // Task shape mirrors the auto-seeder's construction at the SEED_HEALTH_PLAYBOOK
      // dispatch in the health-band-crossing effect below — id shape is load-bearing
      // for both dedup guards, keep them in sync.
      const items = (hpb[a.risk] || []).filter(s => s.title.trim()).map(s => ({
        id: `hpb-${a.id}-${a.risk}-${today}-${s.id}`, accountId: a.id, healthPlaybook: true,
        healthBand: a.risk, healthFor: today, title: "♥ " + s.title,
        due: isoPlus(today, s.dueDays), priority: s.priority, status: "Open", owner: a.csm || "" }))
        .filter(it => !existingIds.has(it.id));
      // Dedupe against ANY same-day event landing on this band, not just backfill-tagged
      // ones — if the auto-seeder already logged a real decline into this band today,
      // don't fabricate a second one. A never-seeded account has no such event, so a
      // legitimate first seed is never suppressed.
      const alreadyLogged = (a.healthEvents || []).some(ev => ev.date === today && ev.to === a.risk);
      const event = alreadyLogged ? null : { date: today, from: "Green", to: a.risk, source: "backfill" };
      if (items.length === 0 && !event) return;
      tasks += items.length;
      accounts += 1;
      // Deliberate re-arm: an account that recovered Red→Yellow keeps healthPlaybookBand
      // "Red" (the auto-seeder only clears it on recovery to Green). Overwriting it here
      // with the current band re-arms a future Red auto-seed. Intended, not an oversight.
      dispatch({ type: "SEED_HEALTH_PLAYBOOK", id: a.id, healthBand: a.risk,
        healthPlaybookBand: a.risk, items, event });
    });
    setDone({ accounts, tasks });
    setConfirming(false);
  };
  return (
    <div className="mt-3 border-t border-slate-200 pt-3">
      <div className="mb-1 text-xs font-bold uppercase tracking-widest text-slate-500">Backfill</div>
      <p className="mb-2 text-sm text-slate-600">
        {cands.length === 0
          ? "No at-risk accounts — nothing to seed."
          : `${cands.length} at-risk accounts — ${fresh} never seeded, ${seeded} already have a playbook (will get a fresh set).`}
      </p>
      {confirming ? (
        <div className="flex items-center gap-2">
          <Btn onClick={run}>{`Confirm — seed ${cands.length} accounts?`}</Btn>
          <Btn onClick={() => setConfirming(false)}>Cancel</Btn>
        </div>
      ) : (
        <Btn disabled={cands.length === 0} onClick={() => { setDone(null); setConfirming(true); }}>Seed playbooks now</Btn>
      )}
      {done && <p className="mt-2 text-sm font-semibold text-emerald-600">
        {done.accounts === 0 ? "Already up to date — nothing to seed." : `Seeded ${done.accounts} accounts (${done.tasks} tasks).`}
      </p>}
    </div>
  );
}

function UsersCard({ me }) {
  const [users, setUsers] = useState([]);
  const [err, setErr] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [v, setV] = useState({ name: "", email: "", pass: "", role: "user" });
  const load = () => sb.from("profiles").select("id,name,role,created_at").order("created_at").then(({ data, error }) => error ? setErr(error.message) : setUsers(data || []));
  useEffect(() => { load(); }, []);
  const setRole = async (u, role) => {
    setErr(""); setMsg("");
    const { error } = await sb.from("profiles").update({ role }).eq("id", u.id);
    if (error) setErr(error.message); else load();
  };
  const [editing, setEditing] = useState(null); // {id, name}
  const renameEverywhere = async (oldName, newName) => {
    // keep account CSM assignments and task owners in sync with the new name
    for (const [t, key] of [["accounts", "csm"], ["tasks", "owner"]]) {
      const { data } = await sb.from(t).select("id,data");
      for (const row of data || []) {
        if (row.data && row.data[key] === oldName) {
          row.data[key] = newName;
          const { error } = await sb.from(t).upsert({ id: row.id, data: row.data });
          if (error) throw error;
        }
      }
    }
  };
  const saveRename = async u => {
    const newName = editing.name.trim();
    setErr(""); setMsg("");
    if (!newName) return setErr("Name cannot be empty.");
    if (newName === u.name) return setEditing(null);
    if (users.some(x => x.id !== u.id && x.name === newName)) return setErr("That name is already taken.");
    setBusy(true);
    try {
      const { error } = await sb.from("profiles").update({ name: newName }).eq("id", u.id);
      if (error) throw error;
      await renameEverywhere(u.name, newName);
      setMsg(`Renamed ${u.name} → ${newName}; their accounts and tasks were updated too.`);
      setEditing(null); load();
    } catch (ex) { setErr(ex.message); }
    setBusy(false);
  };
  const addUser = async e => {
    e.preventDefault(); setErr(""); setMsg("");
    if (!v.name.trim() || !v.email.trim()) return setErr("Name and email are required.");
    if (v.pass.length < 6) return setErr("Temporary password must be at least 6 characters.");
    setBusy(true);

/* case-insensitive subsequence match: "nrw" matches "Northwind" */
function subseqMatch(q, text) {
  q = q.toLowerCase(); text = text.toLowerCase();

const PALETTE_ACTIONS = [
  { key: "activity", label: "Log activity" }, { key: "task", label: "Add task" },

  { key: "edit", label: "Edit account" },

function CommandPalette({ open, onClose, accounts, user, go }) {
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(0);
  useEffect(() => { if (open) { setQ(""); setSel(0); } }, [open]);
  if (!open) return null;
  const views = (user.role === "admin" ? VIEWS : VIEWS.filter(v => v !== "Settings"))
    .filter(v => subseqMatch(q, "go to " + v))
    .map(v => ({ type: "view", id: "v-" + v, label: `Go to ${v}`, run: () => go(v) }));
  const prefix = t => t.toLowerCase().startsWith(q.toLowerCase());
  const accts = accounts.filter(a => subseqMatch(q, a.name))
    .sort((a, b) => (prefix(b.name) - prefix(a.name)) || a.name.localeCompare(b.name))
    .map(a => ({ type: "account", id: a.id, label: a.name + (a.churn ? " · churned" : ""), acct: a, run: () => go("Accounts", a.id) }));
  const rows = (q ? [...accts, ...views] : [...views, ...accts]).slice(0, 12);
  // contextual actions expand under the top account match (only when it leads the list)
  const list = [];
  rows.forEach((r, idx) => {
    list.push(r);
    if (idx === 0 && r.type === "account") {
      PALETTE_ACTIONS.filter(x => !(r.acct.churn && x.key === "renewal")).forEach(x =>
        list.push({ type: "action", id: r.id + "-" + x.key, label: "↳ " + x.label, run: () => go("Accounts", r.acct.id, x.key) }));
    }
  });

    if (e.key === "Escape") { e.stopPropagation(); onClose(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); if (!list.length) return; setSel((cur + 1) % list.length); }
    else if (e.key === "ArrowUp") { e.preventDefault(); if (!list.length) return; setSel((cur - 1 + list.length) % list.length); }
    else if (e.key === "Enter" && list.length) { e.preventDefault(); list[cur].run(); onClose(); }

    <div className="fixed inset-0 z-50 flex items-start justify-center bg-slate-900/40 pt-[15vh]" onClick={onClose}>
      <div role="dialog" aria-modal="true" aria-label="Command palette" className="nm w-full max-w-lg p-3" onClick={e => e.stopPropagation()}>
        <Input autoFocus placeholder="Type a view or account…" value={q}
          onChange={e => { setQ(e.target.value); setSel(0); }} onKeyDown={onKey} className="w-full" />
        <div className="mt-2 max-h-80 overflow-y-auto">
          {list.length === 0 && <div className="px-2 py-1.5 text-sm text-slate-500">No results</div>}
          {list.map((it, i) => (
            <div key={it.id} onClick={() => { it.run(); onClose(); }} onMouseEnter={() => setSel(i)}

      </div>

          {views.map(v => (
            <button key={v} title={v} aria-label={v} aria-current={view === v ? "page" : undefined}
              onClick={() => { setView(v); setAcctId(null); }}
              className={`flex w-full items-center rounded-lg py-2 text-sm font-medium ${collapsed ? "justify-center px-0" : "gap-2.5 px-3"} ${view === v ? "bg-indigo-50 font-semibold text-indigo-700" : "text-slate-600 hover:bg-slate-100 hover:text-slate-900"}`}>
              {NAV_ICONS[v]}{!collapsed && <span className="flex-1 text-left">{v}</span>}
            </button>
          ))}
        </nav>
        <div className={`border-t border-slate-200 ${collapsed ? "p-2" : "p-4"}`}>
          {!collapsed && <>
            <div className="truncate text-sm font-semibold text-slate-900">{user.name}</div>
            <div className="text-xs text-slate-500">{user.role}{loaded ? "" : " · loading…"}</div>
          </>}
          <button title={`Sign out (${user.name})`} className={`nm-btn text-xs font-semibold text-slate-600 ${collapsed ? "flex h-9 w-9 items-center justify-center" : "mt-3 w-full px-3 py-1.5"}`}
            onClick={() => sb.auth.signOut()}>{collapsed ? "⎋" : "Sign out"}</button>
        </div>
      </aside>
      <main className={`${collapsed ? "ml-14" : "ml-52"} min-w-0 flex-1 px-6 py-5 transition-all`}>
      <div className="mb-5 flex items-center gap-3">
        <h1 className="text-xl font-bold tracking-tight text-slate-900">{view === "Accounts" && acctId ? "Account detail" : view}</h1>
        {view !== "Tasks" && <div className="nm-inset ml-3 flex items-center gap-0.5 !rounded-lg p-0.5">
          {[["mine", `My book${myCount ? ` (${myCount})` : ""}`], ["all", "All"]].map(([k, label]) => (
            <button key={k} onClick={() => setScopeSel(k)}
              className={`rounded-md px-3 py-1 text-xs font-semibold ${scope === k ? "bg-indigo-600 text-white shadow-sm" : "text-slate-600 hover:text-slate-900"}`}>{label}</button>
          ))}
        </div>}
        <div className="ml-1"><SyncStatus /></div>
        <div className="relative ml-1">
          <button onClick={() => setNotifOpen(o => !o)} title="Renewal & contract alerts"
            className="nm-btn relative flex h-9 w-9 items-center justify-center text-base">🔔
            {unreadCount > 0 && <span className="absolute -right-0.5 -top-0.5 flex h-4 min-w-[16px] items-center justify-center rounded-full bg-rose-500 px-1 text-[11px] font-bold text-white">{unreadCount}</span>}
          </button>
          {notifOpen && (
            <div className="nm absolute right-0 z-20 mt-2 w-80 p-3">
              <div className="flex items-center justify-between px-2 py-1">
                <span className="text-xs font-semibold text-slate-700">Renewals, contracts &amp; health</span>
                {unreadCount > 0 && <button className="text-[11px] font-semibold text-indigo-600 hover:underline" onClick={() => alerts.forEach(a => markNotifRead(a.id))}>Mark all read</button>}
              </div>
              {alerts.length === 0 && <div className="px-2 py-2 text-sm text-slate-500">Nothing due soon. 🎉</div>}
              {alerts.map(a => { const read = notifRead.has(a.id); return (
                <button key={a.id} onClick={() => { markNotifRead(a.id); setNotifOpen(false); openAccount(a.accountId); }}
                  className="flex w-full items-center justify-between gap-2 rounded px-2 py-1.5 text-left text-sm hover:bg-slate-50">
                  <span className="flex min-w-0 items-center gap-2">
                    <span className={`h-1.5 w-1.5 shrink-0 rounded-full ${read ? "bg-transparent" : "bg-indigo-500"}`} />
                    <span className="min-w-0">
                      <span className={`block truncate ${read ? "font-medium text-slate-500" : "font-semibold text-slate-900"}`}>{a.name}</span>
                      <span className="block truncate text-[11px] text-slate-500">{a.sub}</span>
                    </span>
                  </span>
                  <span className="flex shrink-0 items-center gap-2 text-xs">
                    <span className="text-slate-700">{fmtDate(a.date)}</span>
                    <span className={`rounded px-1.5 py-0.5 font-semibold ${a.days <= 7 ? "bg-rose-100 text-rose-700" : "bg-amber-100 text-amber-700"}`}>{a.days < 0 ? "expired" : a.days + "d"}</span>
                  </span>
                </button>
              ); })}
            </div>
          )}
        </div>
      </div>
      <ViewBoundary key={view} view={view}>
        {view === "Dashboard" && <Dashboard st={st} scored={active} all={visible} allAccounts={scored} scope={scope} setScopeSel={setScopeSel} myCount={myCount} renewalsDue={renewalsDue} user={user} dispatch={dispatch} openAccount={openAccount} openAccounts={openAccounts} />}
        {view === "Tasks" && <TasksView st={st} scored={scored} dispatch={dispatch} user={user} openAccount={openAccount} />}
        {view === "Accounts" && (acctId
          ? <AccountDetail st={st} scored={scored} id={acctId} dispatch={dispatch} back={() => setAcctId(null)} user={user} team={st.team} openAccount={openAccount} initialForm={pendingForm} clearInitialForm={() => setPendingForm(null)} />
          : <AccountList scored={visible} allAccounts={st.accounts} openAccount={openAccount} searchRef={searchRef} dispatch={dispatch} team={st.team} initialFilter={acctFilter} user={user} settings={st.settings} />)}
        {view === "Renewals" && <Renewals scored={active} openAccount={openAccount} dispatch={dispatch} allBook={scored} rates={st.settings.rates} snapshots={st.settings.snapshots || []} tasks={st.tasks} user={user} />}
        {view === "Settings" && user.role === "admin" && <Settings st={st} dispatch={dispatch} user={user} scored={scored} />}
      </ViewBoundary>
      <CommandPalette open={paletteOpen} onClose={() => setPaletteOpen(false)} accounts={scored} user={user}
        go={(v, id, form) => { if (id) openAccount(id, form); else { setView(v); setAcctId(null); } }} />
      <Copyright />
      </main>
    </div>
  );
}
function Root() {
  const [ready, setReady] = useState(false);
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  useEffect(() => {
    if (!CONFIGURED) return;
    sb.auth.getSession().then(({ data }) => { setSession(data.session); setReady(true); });
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);
  useEffect(() => {
    if (!session) { setProfile(null); return; }
    sb.from("profiles").select("id,name,role").eq("id", session.user.id).single()
      // Same reasoning as the saveError helper: profile loading runs BEFORE ToastProvider
      // wraps App, so window.__toast is genuinely undefined here and alert is the only
      // channel left. Deliberately kept.
      .then(({ data, error }) => error ? (window.__toast?.({ text: "Could not load your profile: " + error.message, tone: "error" }) ?? alert("Could not load your profile: " + error.message)) : setProfile(data));
  }, [session]);
  if (!CONFIGURED) return <SetupScreen />;
  if (!ready) return <div className="flex min-h-screen items-center justify-center text-sm text-slate-500">Loading…</div>;
  if (!session) return <AuthScreen />;
  if (!profile) return <div className="flex min-h-screen items-center justify-center text-sm text-slate-500">Loading profile…</div>;
  // Two boundaries, deliberately. The inner per-view one degrades gracefully: a crash in
  // Renewals leaves the nav and every other view usable. This outer one is the backstop --
  // App's own body computes analytics (retentionStats at ~3204), so data that breaks THAT
  // throws before any view renders, and without this the user gets a blank white page.
  return <ToastProvider><ViewBoundary view="the app"><App user={profile} /></ViewBoundary></ToastProvider>;
}
window.__health = { isoPlus, addMonths, BAND_RANK, healthPlaybookOf, DEFAULT_HEALTH_PLAYBOOK, backfillCandidates, bucketTasks, filterTasks, parseCSV, importAccountsCSV,
  retentionStats, cohortData, churnRows, renewalOutcomeRows, quarterKey, monthsBetween, toUSD, diffRow, writeQueue };
ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
