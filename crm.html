<!-- Frame guard: GitHub Pages cannot send X-Frame-Options or CSP frame-ancestors, and a meta
     CSP ignores frame-ancestors. So if another site frames the CRM (clickjacking), hide the
     page, try to break out, and stop loading before the app boots. -->
<script>if(window.self!==window.top){document.documentElement.style.display="none";try{window.top.location.replace(window.self.location.href)}catch(e){}if(window.stop)window.stop();}</script>

<!-- Theme before first paint (Light / Dark / Auto, src/lib/theme.js). Mirrors normalizeChoice
     and resolveTheme -- it must run before React and the stylesheet, so it cannot import them.
     tests/unit/theme.test.mjs pins its shape. -->
<script>(function(){var c;try{c=localStorage.getItem("onevio.theme")}catch(e){}if(c!=="light"&&c!=="dark")c="auto";var d=c==="dark"||(c==="auto"&&!!window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);if(d){document.documentElement.classList.add("dark");var m=document.querySelector('meta[name="theme-color"]');if(m)m.content="#0b1120"}})();</script>

<style id="components">
  /* Primitives, emitted by build.mjs BETWEEN Tailwind's components and utilities (Tailwind's

  .nm.p-4:where(:not([data-toast])), .nm.p-3:where(:not([data-toast])) { padding: 20px; }

  .nm-inset:focus, .nm-inset:focus-within { border-color: var(--f-primary); box-shadow: 0 0 0 3px rgb(79 70 229 / .14); outline: none; }

  /* frame-level controls (outside cards, tables, dialogs): 40px buttons, 42px inputs */
  /* the Btn atom ([data-btn]) carries no size utilities: frame-level 40px / 13.5px / 0 16px / r12,

  [data-btn] { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 6px 16px; font-size: 13.5px; line-height: 20px; font-weight: 600; }

  main :where(.grad, .nm-btn).h-9.w-9:where(:not(.lg\:hidden)) { display: flex; width: 40px; height: 40px; padding: 0; }
