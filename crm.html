<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f6f8fb" />
<!-- Theme before first paint (Light / Dark / Auto, src/lib/theme.js). Mirrors normalizeChoice
     and resolveTheme -- it must run before React and the stylesheet, so it cannot import them.
     tests/unit/theme.test.mjs pins its shape. -->
<script>(function(){var c;try{c=localStorage.getItem("onevio.theme")}catch(e){}if(c!=="light"&&c!=="dark")c="auto";var d=c==="dark"||(c==="auto"&&!!window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);if(d){document.documentElement.classList.add("dark");var m=document.querySelector('meta[name="theme-color"]');if(m)m.content="#0b1120"}})();</script>
<title>OneVio CRM</title>
<!-- tab icon: the sidebar wordmark's O (slate-900) and V (indigo-600) drawn as shapes, since a
     favicon cannot load Inter; white tile so it stays visible on dark tab bars. Inline data URI
     keeps dist/crm.html at zero network requests. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='1' y='1' width='62' height='62' rx='14' fill='%23fff' stroke='%23e2e8f0' stroke-width='2'/><circle cx='19' cy='32' r='11' fill='none' stroke='%230f172a' stroke-width='7'/><path d='M38 20.5 47 44 56 20.5' fill='none' stroke='%234f46e5' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* colour tokens: "R G B" triplets read by tailwind.config.js and the classes below.
     :root = Tailwind's stock palette (the light theme, unchanged). The dark theme overrides
     these under html.dark -- see the dark block. scrim never flips (overlays stay dark). */
  :root {
    --white: 255 255 255; --scrim: 15 23 42; --page: 246 248 251; --line-strong: 211 220 230;
    --slate-50: 248 250 252; --slate-100: 241 245 249; --slate-200: 226 232 240; --slate-300: 203 213 225; --slate-400: 148 163 184; --slate-500: 100 116 139; --slate-600: 71 85 105; --slate-700: 51 65 85; --slate-800: 30 41 59; --slate-900: 15 23 42; --slate-950: 2 6 23;
    --gray-50: 249 250 251; --gray-100: 243 244 246; --gray-200: 229 231 235; --gray-300: 209 213 219; --gray-400: 156 163 175; --gray-500: 107 114 128; --gray-600: 75 85 99; --gray-700: 55 65 81; --gray-800: 31 41 55; --gray-900: 17 24 39; --gray-950: 3 7 18;
    --indigo-50: 238 242 255; --indigo-100: 224 231 255; --indigo-200: 199 210 254; --indigo-300: 165 180 252; --indigo-400: 129 140 248; --indigo-500: 99 102 241; --indigo-600: 79 70 229; --indigo-700: 67 56 202; --indigo-800: 55 48 163; --indigo-900: 49 46 129; --indigo-950: 30 27 75;
    --rose-50: 255 241 242; --rose-100: 255 228 230; --rose-200: 254 205 211; --rose-300: 253 164 175; --rose-400: 251 113 133; --rose-500: 244 63 94; --rose-600: 225 29 72; --rose-700: 190 18 60; --rose-800: 159 18 57; --rose-900: 136 19 55; --rose-950: 76 5 25;
    --amber-50: 255 251 235; --amber-100: 254 243 199; --amber-200: 253 230 138; --amber-300: 252 211 77; --amber-400: 251 191 36; --amber-500: 245 158 11; --amber-600: 217 119 6; --amber-700: 180 83 9; --amber-800: 146 64 14; --amber-900: 120 53 15; --amber-950: 69 26 3;
    --emerald-50: 236 253 245; --emerald-100: 209 250 229; --emerald-200: 167 243 208; --emerald-300: 110 231 183; --emerald-400: 52 211 153; --emerald-500: 16 185 129; --emerald-600: 5 150 105; --emerald-700: 4 120 87; --emerald-800: 6 95 70; --emerald-900: 6 78 59; --emerald-950: 2 44 34;
    --sky-50: 240 249 255; --sky-100: 224 242 254; --sky-200: 186 230 253; --sky-300: 125 211 252; --sky-400: 56 189 248; --sky-500: 14 165 233; --sky-600: 2 132 199; --sky-700: 3 105 161; --sky-800: 7 89 133; --sky-900: 12 74 110; --sky-950: 8 47 73;
  }
  /* dark theme. Screen-only, so printing always uses the light palette. Neutrals invert
     (white = darkest card, slate-900 = lightest text); accents flip around their middle so
     pale badge fills become deep tints and strong text shades become light. Tuned for >= 4.5:1
     text contrast on --white and --page. scrim is deliberately absent: overlays stay dark. */
  @media screen { html.dark {
    color-scheme: dark;
    --white: 19 27 44; --page: 11 17 32; --line-strong: 58 72 94;
    --slate-50: 24 33 52; --slate-100: 30 41 59; --slate-200: 45 58 79; --slate-300: 71 85 105; --slate-400: 125 139 160; --slate-500: 148 163 184; --slate-600: 170 182 199; --slate-700: 203 213 225; --slate-800: 226 232 240; --slate-900: 241 245 249; --slate-950: 248 250 252;

    --indigo-50: 30 32 70; --indigo-100: 38 40 90; --indigo-200: 55 55 125; --indigo-300: 90 95 190; --indigo-400: 129 140 248; --indigo-500: 129 140 248; --indigo-600: 165 180 252; --indigo-700: 199 210 254; --indigo-800: 224 231 255; --indigo-900: 238 242 255; --indigo-950: 245 247 255;
    --rose-50: 50 18 30; --rose-100: 70 22 38; --rose-200: 100 30 50; --rose-300: 150 45 70; --rose-400: 236 90 118; --rose-500: 251 113 133; --rose-600: 251 120 140; --rose-700: 253 164 175; --rose-800: 254 205 211; --rose-900: 255 228 230; --rose-950: 255 241 242;
    --amber-50: 48 32 10; --amber-100: 66 44 12; --amber-200: 92 62 14; --amber-300: 140 95 20; --amber-400: 200 140 30; --amber-500: 245 158 11; --amber-600: 251 191 36; --amber-700: 252 211 77; --amber-800: 253 230 138; --amber-900: 254 243 199; --amber-950: 255 251 235;
    --emerald-50: 10 40 32; --emerald-100: 12 56 44; --emerald-200: 16 80 62; --emerald-300: 25 120 90; --emerald-400: 40 170 125; --emerald-500: 52 211 153; --emerald-600: 52 211 153; --emerald-700: 110 231 183; --emerald-800: 167 243 208; --emerald-900: 209 250 229; --emerald-950: 236 253 245;
    --sky-50: 10 35 52; --sky-100: 12 48 72; --sky-200: 16 70 100; --sky-300: 30 110 150; --sky-400: 56 189 248; --sky-500: 56 189 248; --sky-600: 125 211 252; --sky-700: 125 211 252; --sky-800: 186 230 253; --sky-900: 224 242 254; --sky-950: 240 249 255;
  } }
  /* the chart tooltip box flips light in dark; the band colours (500 shades, fixed hex) are
     too pale on it, so dark mode writes each band in its deep light-palette shade instead */
  @media screen {
    html.dark [data-tip-series="Green"] { fill: rgb(4 120 87); }
    html.dark [data-tip-series="Yellow"] { fill: rgb(180 83 9); }
    html.dark [data-tip-series="Red"] { fill: rgb(190 18 60); }
  }
  html { font-size: 12.5px; }
  body { background: rgb(var(--page)); font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; color: rgb(var(--slate-700)); }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgb(var(--slate-300)); border-radius: 4px; }
  /* design tokens: quiet surfaces, hairline borders, color = meaning */
  .nm { background: rgb(var(--white)); border: 1px solid rgb(var(--slate-200)); border-radius: 12px; box-shadow: 0 1px 2px rgba(15, 23, 42, .04); }
  .nm-sm { background: rgb(var(--white)); border: 1px solid rgb(var(--slate-200)); border-radius: 10px; box-shadow: 0 1px 2px rgba(15, 23, 42, .04); }
  .nm-inset { background: rgb(var(--white)); border: 1px solid rgb(var(--line-strong)); border-radius: 8px; transition: border-color .12s, box-shadow .12s; }
  .nm-inset:focus, .nm-inset:focus-within { border-color: rgb(var(--indigo-500)); box-shadow: 0 0 0 3px rgb(var(--indigo-500) / .12); outline: none; }
  .nm-btn { background: rgb(var(--white)); border: 1px solid rgb(var(--line-strong)); border-radius: 8px; transition: background .12s; }
  .nm-btn:hover { background: rgb(var(--slate-100)); }
  .nm-btn:active { background: rgb(var(--slate-200)); }
  .grad { background: rgb(var(--indigo-600)); border-radius: 8px; box-shadow: 0 1px 2px rgba(79, 70, 229, .3); }
  .grad:hover { background: rgb(var(--indigo-700)); }
  .grad:active { background: rgb(var(--indigo-800)); }
  input[type=range] { accent-color: rgb(var(--indigo-600)); }
  /* phones only: larger base type and tap targets; desktop sizing untouched */
  @media (max-width: 640px) { html { font-size: 14px; } }
</style>
</head>
<body class="text-slate-700">
<div id="root"></div>
<script type="text/babel" data-presets="react"></script>
</body>
</html>
